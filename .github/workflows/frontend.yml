name: frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: uv sync --locked
        working-directory: backend
      # The API types must match the backend's OpenAPI spec.
      - run: npm run api && git diff --exit-code -- openapi.json src/api/schema.d.ts
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: horatio
          POSTGRES_PASSWORD: horatio
          POSTGRES_DB: horatio
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U horatio" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      HORATIO_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked && uv run alembic upgrade head && uv run python -m horatio.rules
        working-directory: backend
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      # Keep-alive as e2e-local.sh sets it: Playwright reuses idle connections with
      # no timeout of its own, and one uvicorn drops at 5 s fails with ECONNRESET.
      - name: Start Horatio
        working-directory: backend
        run: |
          mkdir -p "$RUNNER_TEMP/uploads"
          HORATIO_FRONTEND_DIST=$GITHUB_WORKSPACE/frontend/dist HORATIO_UPLOAD_DIR=$RUNNER_TEMP/uploads \
            uv run uvicorn horatio.app:app --port 8766 --timeout-keep-alive 300 > "$RUNNER_TEMP/horatio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/horatio.pid"
          for i in $(seq 1 30); do curl -sf localhost:8766/api/health && break; sleep 1; done
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: frontend/test-results
          retention-days: 7
      # The running server holds uv's cache lock, and setup-uv's cache step waits
      # five minutes for it, then fails the job after every test has passed.
      - name: Stop Horatio
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/horatio.pid")" 2>/dev/null || true
      # The API's own log, for a failure the browser's side does not explain.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-api-log
          path: ${{ runner.temp }}/horatio.log
          retention-days: 7
