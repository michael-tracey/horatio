name: frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: uv sync --locked
        working-directory: backend
      # The API types must match the backend's OpenAPI spec.
      - run: npm run api && git diff --exit-code -- openapi.json src/api/schema.d.ts
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # The suite split across runners, each with its own database and server. Four
  # shards bring a 35-minute run to about 12; each repeats a minute of setup.
  #
  # The shards run in Microsoft's Playwright image, which has Chromium and the
  # libraries and fonts it needs built in, so a run never waits on Ubuntu's apt
  # mirrors (#679). Its version must be the @playwright/test in package-lock.json:
  # bump the two together (see the README's "e2e in CI").
  e2e-shard:
    name: e2e-shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: horatio
          POSTGRES_PASSWORD: horatio
          POSTGRES_DB: horatio
        options: >-
          --health-cmd "pg_isready -U horatio" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      HORATIO_COOKIE_SECURE: "false"
      # Inside a container the service is reached by its name, on its own port.
      HORATIO_DATABASE_URL: postgresql+psycopg://horatio:horatio@postgres:5432/horatio
    steps:
      - uses: actions/checkout@v4
      # The image's browsers are those of one Playwright version; another one in the
      # lock file would look for browsers the image doesn't have.
      - name: Check the image matches Playwright
        run: |
          image=$(grep -o 'mcr.microsoft.com/playwright:v[0-9.]*' .github/workflows/frontend.yml | head -1 | sed 's/.*:v//')
          lock=$(node -p 'require("./frontend/package-lock.json").packages["node_modules/@playwright/test"].version')
          echo "image $image, @playwright/test $lock"
          test "$image" = "$lock" || { echo "::error::The Playwright image is v$image but package-lock.json has @playwright/test $lock; bump the image in frontend.yml"; exit 1; }
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked && uv run alembic upgrade head && uv run python -m horatio.rules
        working-directory: backend
      # No browser install: the image keeps them in /ms-playwright (PLAYWRIGHT_BROWSERS_PATH).
      - run: npm ci && npm run build
        working-directory: frontend
      # Keep-alive as e2e-local.sh sets it: Playwright reuses idle connections with
      # no timeout of its own, and one uvicorn drops at 5 s fails with ECONNRESET.
      - name: Start Horatio
        working-directory: backend
        run: |
          mkdir -p "$RUNNER_TEMP/uploads"
          HORATIO_FRONTEND_DIST=$GITHUB_WORKSPACE/frontend/dist HORATIO_UPLOAD_DIR=$RUNNER_TEMP/uploads \
            uv run uvicorn horatio.app:app --port 8766 --timeout-keep-alive 300 > "$RUNNER_TEMP/horatio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/horatio.pid"
          for i in $(seq 1 30); do curl -sf localhost:8766/api/health && break; sleep 1; done
      # The list reporter puts each test's time in the log, to weigh the shards by.
      - run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=list
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: frontend/test-results
          retention-days: 7
      # The running server holds uv's cache lock, and setup-uv's cache step waits
      # five minutes for it, then fails the job after every test has passed.
      - name: Stop Horatio
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/horatio.pid")" 2>/dev/null || true
      # The API's own log, for a failure the browser's side does not explain.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-api-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/horatio.log
          retention-days: 7

  # The one check to wait on: it passes only when every shard passed.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success
