# Short descriptions, in our own words, for Vampire traits Yorick's export has
# no description for. Read by tools/import_yorick_catalogue.py, which writes them
# into the catalogue; shown when a player opens a trait in the creation wizard.
# A description in Yorick's export wins over one here.

[attributes]
Physical = "Strength, speed and toughness. Your test pool for physical challenges, including most combat."
Social = "Charm, presence and the ability to sway others. Your test pool for social challenges."
Mental = "Reason, awareness and force of will. Your test pool for mental challenges."

[focus_physicals]
Strength = "Raw muscle: lifting, breaking and hitting hard. Some powers do more for a character with this focus."
Dexterity = "Speed, agility and precision. Some powers do more for a character with this focus."
Stamina = "Toughness and endurance. Some powers do more for a character with this focus."

[focus_socials]
Appearance = "Looks, and how readily others are drawn to you. Some powers do more for a character with this focus."
Charisma = "Charm and the force of your personality. Some powers do more for a character with this focus."
Manipulation = "Getting people to do what you want without their noticing. Some powers do more for a character with this focus."

[focus_mentals]
Intelligence = "Reasoning, memory and learning. Some powers do more for a character with this focus."
Perception = "Noticing things and reading what is around you. Some powers do more for a character with this focus."
Wits = "Thinking fast and reacting quickly. Some powers do more for a character with this focus."

[skills]
Academics = "A broad education: history, the arts, philosophy and the like. Lets you research, critique and recall what an educated person would know."
"Animal Ken" = "Understanding animals: calming, training and reading them, and getting them to trust you."
Athletics = "Running, jumping, climbing, swimming and throwing. Physical training beyond the everyday."
Awareness = "Keen senses and a feel for when something unnatural is at work around you."
Brawl = "Fighting with your body: fists, feet, grapples and claws."
Computer = "Using, programming and breaking into computers and networks."
Crafts = "Making things with skill, from fine art to mechanical repair. Taken for one field at a time, such as Carpentry or Painting."
Dodge = "Getting out of the way of blows, bullets and anything else thrown at you."
Drive = "Driving well under pressure: chases, stunts and dangerous conditions. Further dots cover other kinds of vehicle."
Empathy = "Reading moods, motives and emotions, and understanding what makes people tick."
Firearms = "Handling, maintaining and shooting guns accurately."
Intimidation = "Frightening people into backing down or doing what you want, through threat or sheer presence."
Investigation = "Searching scenes, following leads and piecing clues together."
Leadership = "Inspiring and directing others, and planning so a group works well together."
Linguistics = "Languages beyond your native tongue: each dot is another language you speak fluently."
Lore = "Hidden knowledge of the supernatural world, such as Kindred or a clan. Each dot gives a specialisation in one subject."
Medicine = "Anatomy, first aid, diagnosis and treatment, and knowledge of drugs."
Melee = "Fighting with hand-held weapons, from knives to swords and clubs."
Occult = "Knowledge of magic, myth and the mystical, true and false alike."
Performance = "Entertaining an audience with talent and technique. Taken for one field at a time, such as Singing or Acting."
Science = "Formal study of a scientific field. Taken for one field at a time, such as Chemistry or Physics."
Security = "Locks, alarms and surveillance: getting past them, or setting them up."
Stealth = "Moving unseen and unheard, and hiding when others look for you."
Streetwise = "Knowing the streets: their people, rules, slang and where to get things."
Subterfuge = "Lying, bluffing and misdirection, and spotting when someone does it to you."
Survival = "Finding your way and staying alive in the wild: tracking, shelter and navigation."

[backgrounds]
Allies = "Mortals who help you because they want to, each with their own talents. They can act on your behalf between games."
"Alternate Identity" = "A second, well-established identity, with the papers, history and acquaintances to make it convincing."
Contacts = "People in a field who pass you information when you ask."
Fame = "Mortals know who you are, which opens doors but makes it harder to go unnoticed."
Generation = "How close your blood is to Caine's. Every vampire needs at least 1 dot; more dots mean potent blood and a larger blood pool."
Haven = "A safe place to rest by day. More dots make it larger and more secure."
Herd = "Mortals you can feed on easily, so finding blood takes less effort."
"Influences: The Elite" = "Pull among society's powerful, such as politics, finance, the media and high society. Used between games to make things happen."
"Influences: The Underworld" = "Pull among society's underside, such as crime, the street and the transient. Used between games to make things happen."
Resources = "Money and property: the more dots, the more you can afford and the better you live."
Retainers = "Loyal servants, often ghouls, who serve you directly."
Rituals = "For initiated Sabbat only: the ritae you know and can lead for your pack, such as the Vaulderie. More dots, more ritae."
"Shared Haven" = "A haven you share with others, each of you adding to it."

[disciplines]
Animalism = "Kinship with beasts and the Beast within: speak to and command animals, and soothe or rouse frenzy."
Auspex = "Heightened senses and psychic insight: see auras, read minds, and send your senses far away."
Celerity = "Supernatural speed: act faster, and more often, than others can."
Chimerstry = "Illusions that deceive every sense, growing real enough to harm. The Ravnos discipline."
Daimoinon = "Infernal power: sense sin and weakness in others, and corrupt and curse them. The Baali discipline."
Dementation = "Madness as a weapon: unsettle, confuse and break others' minds. A Malkavian discipline."
Dominate = "Command the mind through eye contact and voice: give orders, rewrite memories, even possess."
Fortitude = "Supernatural toughness: shrug off harm, even from fire and sunlight."
Kineticism = "Store kinetic energy as charges, and release it in bursts of force. Learned only by Caitiff, through the Inceptor merit."
Melpominee = "The voice as a supernatural instrument: carry it far, stir emotions, and shatter with song. The Daughters of Cacophony's discipline."
Mytherceria = "Fae-touched magic born of the Kiasyd's strange heritage. The Kiasyd discipline."
"Necromancy: Ash Path" = "Necromancy of the Shadowlands, the realm of the dead: see into it, reach into it and walk there."
"Necromancy: Bone Path" = "Necromancy of corpses: raise and command the dead body, and animate it with a spirit."
"Necromancy: Mortis Path" = "Necromancy of death and decay: wither the living, and cheat death yourself."
"Necromancy: Path of Grief" = "Necromancy that draws on the mind's bond with death, bringing grief and the emotions of loss to the surface."
"Necromancy: Path of Soul Bonding" = "Necromancy that binds wraiths, the souls of the dead, and draws on their knowledge and power."
"Necromancy: Sepulchre Path" = "Necromancy of ghosts: see, summon and command the restless dead."
Obeah = "The gentle power of healing: sense pain and mend wounds of body and mind. The Salubri healers' discipline."
Obfuscate = "Hide in plain sight: go unnoticed, wear another face, or vanish from memory."
Obtenebration = "Command of shadow: shape darkness into arms and tendrils, and become shadow yourself. The Lasombra discipline."
Potence = "Supernatural strength: hit harder, lift more, break what should not break."
Presence = "Supernatural charisma: draw admiration, inspire awe or terror, and command devotion."
Protean = "Shapeshifting: claws, sight in the dark, sinking into the earth, and taking animal form. The Gangrel discipline."
Quietus = "The assassin's art: silence, poison and turning your blood into a weapon. The Assamite discipline."
Serpentis = "The serpent's gifts: a hypnotic gaze, a serpent's tongue and skin, and a serpent's form. The Followers of Set's discipline."
Spiritus = "Shamanic bond with the spirits of nature: sense, call on and borrow from them. The Ahrimanes' discipline."
Temporis = "Mastery of time: slow it for others, speed it for yourself, and sense its flow. The True Brujah discipline."
Thanatosis = "Death and decay: encourage and feed on blight and deterioration, in your own flesh and others'. The Samedi discipline."
"Thaumaturgy: Green Path" = "Blood magic over plants: speak with them, make them grow and move at your command."
"Thaumaturgy: Lure of Flames" = "Blood magic that summons and directs fire, which vampires dread above all."
"Thaumaturgy: Movement of the Mind" = "Blood magic that moves objects and people by will alone, up to flight."
"Thaumaturgy: Path of Blood" = "The core of blood magic: taste and steal blood, sense its potency, and boil it in the veins."
"Thaumaturgy: Path of Caelestikinesis" = "Blood magic drawn from the stars and the forces that move the heavens."
"Thaumaturgy: Path of Conjuring" = "Blood magic that conjures objects out of nothing, temporary at first, lasting later."
"Thaumaturgy: Path of Corruption" = "Blood magic that twists minds and morals, warping vices and virtues."
"Thaumaturgy: Path of Elemental Mastery" = "Blood magic over earth, stone and the inanimate world."
"Thaumaturgy: Path of Neptune's Might" = "Blood magic over water: see through it, move it and drown with it."
"Thaumaturgy: Path of Technomancy" = "Blood magic over machines and electronics: sense, control and corrupt them."
"Thaumaturgy: Path of Weather Mastery" = "Blood magic over the weather: fog, rain, wind and lightning."
Valeren = "The warrior's discipline, created by the Salubri to defend their clan in battle."
Vicissitude = "Flesh-shaping: sculpt your own body and others', down to bone. The Tzimisce discipline."
Visceratika = "Gifts of stone: skin like granite, merging into rock, and sensing through it. The Gargoyles' discipline."
