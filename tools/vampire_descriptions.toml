# Short descriptions, in our own words, for Vampire traits Yorick's export has
# no description for, summarised from MET: VTM, Volume 2 and Volume 2 Issue 1.
# Read by tools/import_yorick_catalogue.py, which writes them
# into the catalogue; shown when a player opens a trait in the creation wizard.
# A description in Yorick's export wins over one here.

[attributes]
Physical = "Strength, speed and toughness. Your test pool for physical challenges, including most combat."
Social = "Charm, presence and the ability to sway others. Your test pool for social challenges."
Mental = "Reason, awareness and force of will. Your test pool for mental challenges."

[focus_physicals]
Strength = "Raw muscle: lifting, breaking and hitting hard. Some powers do more for a character with this focus."
Dexterity = "Speed, agility and precision. Some powers do more for a character with this focus."
Stamina = "Toughness and endurance. Some powers do more for a character with this focus."

[focus_socials]
Appearance = "Looks, and how readily others are drawn to you. Some powers do more for a character with this focus."
Charisma = "Charm and the force of your personality. Some powers do more for a character with this focus."
Manipulation = "Getting people to do what you want without their noticing. Some powers do more for a character with this focus."

[focus_mentals]
Intelligence = "Reasoning, memory and learning. Some powers do more for a character with this focus."
Perception = "Noticing things and reading what is around you. Some powers do more for a character with this focus."
Wits = "Thinking fast and reacting quickly. Some powers do more for a character with this focus."

[skills]
Academics = "A broad education: history, the arts, philosophy and the like. Lets you research, critique and recall what an educated person would know."
"Animal Ken" = "Understanding animals: calming, training and reading them, and getting them to trust you."
Athletics = "Running, jumping, climbing, swimming and throwing. Physical training beyond the everyday."
Awareness = "Keen senses and a feel for when something unnatural is at work around you."
Brawl = "Fighting with your body: fists, feet, grapples and claws."
Computer = "Using, programming and breaking into computers and networks."
Crafts = "Making things with skill, from fine art to mechanical repair. Taken for one field at a time, such as Carpentry or Painting."
Dodge = "Getting out of the way of blows, bullets and anything else thrown at you."
Drive = "Driving well under pressure: chases, stunts and dangerous conditions. Further dots cover other kinds of vehicle."
Empathy = "Reading moods, motives and emotions, and understanding what makes people tick."
Firearms = "Handling, maintaining and shooting guns accurately."
Intimidation = "Frightening people into backing down or doing what you want, through threat or sheer presence."
Investigation = "Searching scenes, following leads and piecing clues together."
Leadership = "Inspiring and directing others, and planning so a group works well together."
Linguistics = "Languages beyond your native tongue: each dot is another language you speak fluently."
Lore = "Hidden knowledge of the supernatural world, such as Kindred or a clan. Each dot gives a specialisation in one subject."
Medicine = "Anatomy, first aid, diagnosis and treatment, and knowledge of drugs."
Melee = "Fighting with hand-held weapons, from knives to swords and clubs."
Occult = "Knowledge of magic, myth and the mystical, true and false alike."
Performance = "Entertaining an audience with talent and technique. Taken for one field at a time, such as Singing or Acting."
Science = "Formal study of a scientific field. Taken for one field at a time, such as Chemistry or Physics."
Security = "Locks, alarms and surveillance: getting past them, or setting them up."
Stealth = "Moving unseen and unheard, and hiding when others look for you."
Streetwise = "Knowing the streets: their people, rules, slang and where to get things."
Subterfuge = "Lying, bluffing and misdirection, and spotting when someone does it to you."
Survival = "Finding your way and staying alive in the wild: tracking, shelter and navigation."

[backgrounds]
Allies = "Mortals who help you because they want to, each with their own talents. They can act on your behalf between games."
"Alternate Identity" = "A second, well-established identity, with the papers, history and acquaintances to make it convincing."
Contacts = "People in a field who pass you information when you ask."
Fame = "Mortals know who you are, which opens doors but makes it harder to go unnoticed."
Generation = "How close your blood is to Caine's. Every vampire needs at least 1 dot; more dots mean potent blood and a larger blood pool."
Haven = "A safe place to rest by day. More dots make it larger and more secure."
Herd = "Mortals you can feed on easily, so finding blood takes less effort."
"Influences: The Elite" = "Pull among society's powerful, such as politics, finance, the media and high society. Used between games to make things happen."
"Influences: The Underworld" = "Pull among society's underside, such as crime, the street and the transient. Used between games to make things happen."
Resources = "Money and property: the more dots, the more you can afford and the better you live."
Retainers = "Loyal servants, often ghouls, who serve you directly."
Rituals = "For initiated Sabbat only: the ritae you know and can lead for your pack, such as the Vaulderie. More dots, more ritae."
"Shared Haven" = "A haven you share with others, each of you adding to it."

[disciplines]
Animalism = "Kinship with beasts and the Beast within: speak to and command animals, and soothe or rouse frenzy."
Auspex = "Heightened senses and psychic insight: see auras, read minds, and send your senses far away."
Celerity = "Supernatural speed: act faster, and more often, than others can."
Chimerstry = "Illusions that deceive every sense, growing real enough to harm. The Ravnos discipline."
Daimoinon = "Infernal power: sense sin and weakness in others, and corrupt and curse them. The Baali discipline."
Dementation = "Madness as a weapon: unsettle, confuse and break others' minds. A Malkavian discipline."
Dominate = "Command the mind through eye contact and voice: give orders, rewrite memories, even possess."
Fortitude = "Supernatural toughness: shrug off harm, even from fire and sunlight."
Kineticism = "Store kinetic energy as charges, and release it in bursts of force. Learned only by Caitiff, through the Inceptor merit."
Melpominee = "The voice as a supernatural instrument: carry it far, stir emotions, and shatter with song. The Daughters of Cacophony's discipline."
Mytherceria = "Fae-touched magic born of the Kiasyd's strange heritage. The Kiasyd discipline."
"Necromancy: Ash Path" = "Necromancy of the Shadowlands, the realm of the dead: see into it, reach into it and walk there."
"Necromancy: Bone Path" = "Necromancy of corpses: raise and command the dead body, and animate it with a spirit."
"Necromancy: Mortis Path" = "Necromancy of death and decay: wither the living, and cheat death yourself."
"Necromancy: Path of Grief" = "Necromancy that draws on the mind's bond with death, bringing grief and the emotions of loss to the surface."
"Necromancy: Path of Soul Bonding" = "Necromancy that binds wraiths, the souls of the dead, and draws on their knowledge and power."
"Necromancy: Sepulchre Path" = "Necromancy of ghosts: see, summon and command the restless dead."
Obeah = "The gentle power of healing: sense pain and mend wounds of body and mind. The Salubri healers' discipline."
Obfuscate = "Hide in plain sight: go unnoticed, wear another face, or vanish from memory."
Obtenebration = "Command of shadow: shape darkness into arms and tendrils, and become shadow yourself. The Lasombra discipline."
Potence = "Supernatural strength: hit harder, lift more, break what should not break."
Presence = "Supernatural charisma: draw admiration, inspire awe or terror, and command devotion."
Protean = "Shapeshifting: claws, sight in the dark, sinking into the earth, and taking animal form. The Gangrel discipline."
Quietus = "The assassin's art: silence, poison and turning your blood into a weapon. The Assamite discipline."
Serpentis = "The serpent's gifts: a hypnotic gaze, a serpent's tongue and skin, and a serpent's form. The Followers of Set's discipline."
Spiritus = "Shamanic bond with the spirits of nature: sense, call on and borrow from them. The Ahrimanes' discipline."
Temporis = "Mastery of time: slow it for others, speed it for yourself, and sense its flow. The True Brujah discipline."
Thanatosis = "Death and decay: encourage and feed on blight and deterioration, in your own flesh and others'. The Samedi discipline."
"Thaumaturgy: Green Path" = "Blood magic over plants: speak with them, make them grow and move at your command."
"Thaumaturgy: Lure of Flames" = "Blood magic that summons and directs fire, which vampires dread above all."
"Thaumaturgy: Movement of the Mind" = "Blood magic that moves objects and people by will alone, up to flight."
"Thaumaturgy: Path of Blood" = "The core of blood magic: taste and steal blood, sense its potency, and boil it in the veins."
"Thaumaturgy: Path of Caelestikinesis" = "Blood magic drawn from the stars and the forces that move the heavens."
"Thaumaturgy: Path of Conjuring" = "Blood magic that conjures objects out of nothing, temporary at first, lasting later."
"Thaumaturgy: Path of Corruption" = "Blood magic that twists minds and morals, warping vices and virtues."
"Thaumaturgy: Path of Elemental Mastery" = "Blood magic over earth, stone and the inanimate world."
"Thaumaturgy: Path of Neptune's Might" = "Blood magic over water: see through it, move it and drown with it."
"Thaumaturgy: Path of Technomancy" = "Blood magic over machines and electronics: sense, control and corrupt them."
"Thaumaturgy: Path of Weather Mastery" = "Blood magic over the weather: fog, rain, wind and lightning."
Valeren = "The warrior's discipline, created by the Salubri to defend their clan in battle."
Vicissitude = "Flesh-shaping: sculpt your own body and others', down to bone. The Tzimisce discipline."
Visceratika = "Gifts of stone: skin like granite, merging into rock, and sensing through it. The Gargoyles' discipline."

[merits]
"Abstract Awareness" = "When you use Heightened Senses you can instead look into the Shadowlands, the Umbra or the Dreaming, seeing the wraiths, spirits or chimerical beings there and speaking with them."
"Abyssal Horror" = "Black Metamorphosis can take a kraken-like Abyssal Horror form instead: all its usual benefits, unarmed attacks with Reach, and swimming at your normal speed."
"Adaptive" = "Choose one in-clan discipline you have: you always get its focus benefit, even without the matching attribute focus."
"All the Best Toys" = "Gain 5 dots of Drive (dots you already had are refunded). A downtime action can acquire a vehicle worth up to $30,000, land, sea or air; more actions and Resources buy better ones."
"Aquatic Predator" = "Shape of the Beast gains a third form, a sea creature of your choosing with the Aquatic template; with the Wits focus it can take another template."
"Arcane Branding" = "Tremere runes give you the benefits of Magic Resistance, except against blood magic cast by Tremere or their bloodlines. Cannot be taken with Magic Resistance."
"Ardent Companion" = "A loyal animal companion: a ghouled animal Retainer built as a rating 7 Stock NPC."
"Art Imitates Life" = "Gain the Appearance focus and choose, for good, Grotesque (+1 wild card to Intimidation attacks) or Angelic (+1 wild card to Leadership attacks); you may buy that skill at new level x1 XP."
"Baali" = "Infernal Acolyte: you were Embraced into another common clan and reborn a Baali. One of your old clan's disciplines becomes Daimoinon; the three left are your in-clan disciplines. Creation only."
"Bane of the Aeons" = "Regain 1 Willpower whenever someone spends Willpower to resist your temptation, coercion or attempts to bind them."
"Bane's Blessing" = "Immune to mundane poisons and to the effects and damage of Quietus (aggravated Quietus damage becomes normal damage). You can also try to expel supernatural poisons."
"Beauty of the Beholder" = "Gain the Appearance focus, and a simple action gives you Gaze and Focus on a target within six steps. May be taken alongside Necromantic Expertise."
"Become the Slasher" = "Choose one specific sin, for good. When you see someone commit it, your hunt for them is empowered. The Storyteller approves the choice, and it may never target a real-world group."
"Beneath Notice" = "Secret routes let you reach the outside of any familiar place in the same city in half the time, uncaught unless pursuers have this merit too, taking up to your Streetwise in companions. Mask of a Thousand Faces and Conceal are strengthened."
"Blessing of the Gorgons" = "Gain Serpentis as a fourth in-clan discipline, as with Additional Uncommon Discipline."
"Blood Deceit" = "Forged family records make you pass as a Giovanni: Alternate Identity 4, and +2 wild card to resist any attempt, mundane or supernatural, to learn your true nature."
"Blood in the Water" = "Sniff the air to sense open wounds in sight (a mile underwater; further with Heightened Senses) and track their source. Your damaging attacks on a target with an open wound gain Brutal and Deadly."
"Blood Knows the Way" = "A simple action smearing 1 point of a target's Blood on your face and hands gives +2 wild card to all your attacks against them for the game session, while the blood stays visible."
"Blood of the Ancients" = "+2 wild card to defend against all Necromancy, and your Willpower retest against it costs no Willpower. No help against Thaumaturgy."
"Blood of the Tzimisce" = "The spirits of your land guard you: +3 to all attack test pools while in your haven. Gain 2 free dots of Lore, and your Lore can go 2 higher."
"Blood Secrets" = "Examine a point of someone's Blood to learn which of their skills are at 4 dots or more, and spend downtime brewing it into a potion that grants one of those skills."
"Bloodline: Ahrimanes" = "You are one of the all-female Ahrimanes. In-clan: Animalism, Presence and Thaumaturgy: Path of Elemental Mastery."
"Bloodline: Ananke" = "You are one of the Ananke, haruspices who read the bodies of the recently dead. In-clan: Auspex, Dementation and Presence."
"Bloodline: Anda" = "You are one of the Anda, the Mongol horse-lord Gangrel thought lost to history. In-clan: Animalism, Potence and Protean."
"Bloodline: Angelis Ater" = "You are one of the Angelis Ater, the Black Angels, Baali sprung from satanic Lasombra. In-clan: Daimoinon, Dominate, and your choice of Potence, Presence or Obfuscate."
"Bloodline: Brahman" = "You are one of the Brahman, Indian philosophers and gurus. In-clan: Animalism, Auspex and Chimerstry."
"Bloodline: Bratovitch" = "You are a Bratovitch, Embraced from a crude, violent revenant family of the Tzimisce. In-clan: Animalism, Potence and Vicissitude."
"Bloodline: Carpathian" = "You are a Carpathian. In-clan: Animalism, Auspex and Dominate. You can never learn Vicissitude, but may learn Protean without a teacher."
"Bloodline: Corsairs" = "You are a Corsair, a Lasombra raider who left the old courts for plunder and freedom on the seas. In-clan: Celerity, Obtenebration and Presence."
"Bloodline: Coyote" = "You are a Coyote, the urban \"City Gangrel\". In-clan: Celerity, Obfuscate and Protean."
"Bloodline: Creeps" = "You are one of the Creeps, Nosferatu once imprisoned in the dark Depths as feeding stock. In-clan: Animalism, Auspex and Obfuscate."
"Bloodline: Crusader" = "You are a Crusader, a stern Ventrue bloodline now winning respect. In-clan: Auspex, Dominate and Fortitude."
"Bloodline: Healer" = "You are a Salubri Healer, a throwback to more peaceful nights. In-clan: Auspex, Fortitude and Obeah."
"Bloodline: Ishtarri" = "You are one of the Ishtarri, devoted to perfect movement in dance or battle. In-clan: Celerity, Fortitude and Presence."
"Bloodline: Kiasyd" = "You are a Kiasyd, a fae-touched, solitary and studious offshoot of the Lasombra. In-clan: Dominate, Mytherceria and Obtenebration."
"Bloodline: Knights of the Moon" = "You are a Knight of the Moon, a Malkavian line without Dementation. In-clan: Auspex, Dominate and Obfuscate."
"Bloodline: Koldun" = "You are a Koldun, a Tzimisce sorcerer of the old blood magic. In-clan: Animalism, Auspex and Thaumaturgy: Path of Elemental Mastery, and you may learn one other Thaumaturgy path of your choice."
"Bloodline: Lamia" = "You are one of the Lamia, women once sworn to guard their Cappadocian masters. In-clan: Fortitude, Necromancy: Mortis Path and Potence."
"Bloodline: Noiad" = "You are one of the Noiad, who live in the far north to study the Northern Lights. In-clan: Animalism, Auspex and Protean."
"Bloodline: Premascine" = "You are a Premascine, a throwback to an older line of the clan: free of the usual Giovanni weakness, and able to learn Necromancy: Mortis Path."
"Bloodline: Samedi" = "You are one of the Samedi, rotting practitioners of voudon. In-clan: Fortitude, Obfuscate and Thanatosis."
"Bloodline: Sorcerer" = "You belong to the Assamite Sorcerer caste, sworn against the Tremere and the Viziers. In-clan: Obfuscate, Quietus and Thaumaturgy: Lure of Flames, and you may learn one other Thaumaturgy path of your choice."
"Bloodline: Telyav" = "You are one of the Telyav, Lithuanian pagan Tremere thought extinct, and wise to stay hidden. In-clan: Auspex, Presence and Thaumaturgy: Path of Blood."
"Bloodline: Tlacique" = "You are one of the Tlacique, who claim descent from Aztec vampires. In-clan: Presence, Obfuscate and Protean."
"Bloodline: True Brujah" = "You are a True Brujah, scornful of the clan's passions and devoted to cold study. In-clan: Potence, Presence and Temporis."
"Bloodline: Vipers" = "You are a Viper, a warrior who guards the Setite temples. In-clan: Potence, Presence and Serpentis."
"Bloodline: Vizier" = "You are a Vizier, of the caste that defied Haqim's worship and fled the Mountain. In-clan: Auspex, Celerity and Quietus."
"Bloodline: Volgirre" = "You are one of the Volgirre, a secret line of antitribu returned to the Camarilla. Toreador in-clan disciplines, and you may buy the first 2 dots of Vicissitude without a teacher."
"Bonds of Stolen Vitae" = "Choose Auspex, Animalism, Obfuscate or Protean, for good: it becomes an extra in-clan discipline, as with Additional Common Discipline. Creation only."
"Borrowed Time" = "Once an hour in combat, after someone declares an action, you act first; they must then carry out exactly what they declared."
"Breaking Point" = "While in any frenzy, an opposed Brawl or Melee challenge you win is an exceptional success."
"Chimerical Templar" = "Illusory defenders you create with Chimerstry gain 2 extra Healthy health levels, and armed ones can carry two weapon qualities, which apply when they attack through Horrid Reality."
"Chosen of Cappadocius" = "Gain two specialisations each in Lore, Linguistics and Academics, and buy rituals at their rating x1 XP. May be taken alongside Necromantic Expertise."
"Chosen of the Crone" = "Learn Thaumaturgy's Neptune's Might, Weather Control and Elemental Mastery paths without a teacher at in-clan cost (they are not in-clan), and take the Path of Feral Heart, Lilith or Harmony merit at no cost."
"Consecrated Grove" = "Gain Haven 5 for a remote grove away from any city. There, a simple action calls its spirits to defend you: +5 wild card to your Physical defense."
"Death Becomes You" = "Whenever you are present at someone's death, you immediately regain all your spent Willpower."
"Death's Virtuoso" = "Necromantic rituals take you only 5 minutes to cast, with +3 wild card to their challenges. May be taken alongside Necromantic Expertise."
"Demon Slayer" = "+2 wild card to Valeren challenges against demons, Baali and other infernalists, and Armor of Caine's Fury also gives the Rugged quality, its levels returning one an hour."
"Diva" = "Gain Fame 2 free (earlier dots refunded or moved). Once per game, your Fame can stand in for Allies, Contacts, Herd, Haven or Resources."
"Dust in the Wind" = "Gain the Strength focus. When you discorporate (Earth Meld, Mist Form and the like) you can take a ghouled animal up to horse size, or a vehicle up to a motorcycle, with you."
"Emptiness of Faith" = "True Faith of rating 1 or 5 has no effect on you; ratings 2 to 4 still do."
"Ephemeral Rhapsody" = "Art you make yourself, in a field you are specialised in, counts your Crafts as double, and holds 5 Blood a vampire can drink (destroying it). Only three such pieces can exist at once."
"Extrasensory Perceptions" = "The benefits of Acute Sense for both hearing and smell, and the Perception focus."
"Fae Blood" = "You see past fae mien and into the Dreaming, count as two steps lower on the Banality scale with changelings, and anyone who drinks your blood can glimpse the Dreaming for the rest of the night."
"Favored of Inauhaten" = "Path of Corruption and ordinary Serpentis powers (and techniques needing Serpentis) fail against you unless you allow them; +3 wild card to defend against elder and luminary Serpentis."
"Fear Factor" = "Your Quell the Beast terrifies the target's Beast instead of calming it, and can drive a frenzied target into fear frenzy instead of ending the frenzy."
"Fervent Iconoclast" = "On an exceptional success in a Physical attack, end one discipline power your target has active (not transformations, Celerity, Potence, Fortitude or Fleshcraft); they may use it again next action."
"Flexible Morals" = "Your Morality drops to 3 if higher, but you lose Morality only at 7 Beast traits instead of 5. Frenzy and acts like diablerie affect you as normal."
"Flower of Kupala" = "Spend a downtime action to lower every blood bond and vinculum on yourself or on a willing, torpid or restrained character by 1."
"Forge of the Soul" = "Gain Medium, and Thaumaturgic Expertise for the Path of Conjuring only, free. What you conjure can touch and harm ghosts and spirits."
"Greater Colors" = "When you win an opposed challenge with an Auspex power (not techniques, elder or luminary powers), it is always an exceptional success."
"Hard as Steel" = "Buy one Fortitude elder power or technique your generation would otherwise bar (not the luminary power): elder powers at 20 XP, techniques at 12 XP, prerequisites still apply."
"Humble Abode" = "Gain 2 free Haven advantages for one haven; Library research there takes 10 minutes, for visitors too. A downtime action can rearrange a haven's advantages, or a location's qualities."
"Immortal Beauty" = "In an opposed challenge for a discipline power that uses your Social attribute, you get the power's focus benefit even without its attribute focus."
"Inceptor" = "Take Kineticism, or one Necromancy or Thaumaturgy path (Mortis included), as one of your three in-clan disciplines. A path gained this way is not blood magic: no rituals."
"Iron Heart" = "Your Willpower retests against Dominate, Presence and other powers that compel you cost no Willpower, and allies you assist in mass combat share the benefit for the turn."
"Iron Scales" = "Gain Fortitude as an extra in-clan discipline, as with Additional Common Discipline."
"Itty Bitty Living Space" = "Your melee weapon attacks gain Reach, a simple action frees you from any grapple, and you can squeeze through spaces 18 inches a side."
"Jack Be Nimble" = "Burst of Speed, Quick Draw and Pierce the Heart cost you no Willpower, and Blinding Attack, Disarm and Knockdown paid with Willpower do not count toward a target's attack limit."
"Jaded Existence" = "Chimerstry powers of 1 to 5 dots (and techniques needing it) fail against you; +3 wild card against elder and luminary Chimerstry. You still see illusions, but know them for what they are."
"Knowledge is a Sword" = "After three standard actions of preparation, use your Lore or Academics dots in place of any other skill for one challenge."
"Kupala's Bounty" = "You may buy two more paths of Thaumaturgy. Once only."
"Lichborne" = "Your aura shows as an empty, dead one, hiding your nature, emotions and diablerie. You may take the Path of Death and the Soul merit free, and eating flesh gives you no Beast traits. May be taken with Necromantic Prowess."
"Lifegiver" = "Use Obeah on a willing target up to your Medicine in steps away, and each Blood you spend on Corpore Sano heals 1 more point of damage."
"Loa's Rebirth" = "Once, when killed, you crumble to ash and rise at full health in your haven or the last Elysium. You then have one lunar cycle to kill your killer, or Baron Samedi takes your soul instead."
"Local Legends" = "In your home area, mortal authorities write off your deeds: Indirect Influence Attacks cannot target you, and only a flagrant Masquerade breach before many witnesses brings mortal or hunter trouble."
"Luck of the Damned" = "Once per game, a standard action declares an uncontested escape. Not if you are grappled, staked or sealed in."
"Madness Hunter" = "Dementation powers of 1 to 5 dots (and techniques needing it) fail against you; +3 wild card against elder and luminary Dementation."
"Malkavian Time" = "Concentrate for five turns to search the Malkavian madness network for one answer another Malkavian knows, such as whether someone is Malkavian or a fact from a specialisation."
"Master of the Hounds" = "A Retainer can be a hellhound, and you get two of them for one background. A lost hellhound returns a week later."
"Master of Vice" = "Buy Herd at 1 XP a dot whatever your generation, and spend it as if it were Contacts, Retainers or Allies."
"Memento Mori" = "Buy one Necromancy ritual per dot of Dementation (techniques and elder powers included), with Dementation as your primary path for rituals."
"Method to the Madness" = "Hold unspent downtime actions in reserve, then spend them during the game as if you had taken them beforehand on a hunch."
"Mind Games" = "Your Horrid Reality illusions can strike the mind instead: targets defend with Social + Willpower instead of Physical + Dodge."
"Moloch's Heir" = "Gain the Infernal Power merit free, with no demon as master, and learning more Daimoinon does not corrupt you further."
"Moon Bound" = "Each game, the moon's phase gives you a focus and +2 wild card to one skill: Stealth at the new moon, Occult at the crescent, Awareness at the half moon, and more as it waxes."
"Nature Walk" = "Spend 1 Blood to meld into natural wood, stone or soil as with Earth Meld, and from there emerge from other natural ground up to 15 steps away."
"Necrosynthesis" = "Necromancy powers you use without an opposed challenge get their focus benefit even without the attribute focus."
"No Place Like.Home" = "Your haven gains a Supernatural quality, your home soil can stand in for most ritual components, and you may buy one extra ritual per dot of Thaumaturgy."
"Not My Time" = "You may relent in any hostile challenge; if it does not kill you or send you into torpor, regain 1 Willpower."
"Not On My Watch" = "When you protect someone with Assist Defender and the attack fails, you may counterattack the attacker at once, without spending an action."
"Obsessive Study" = "The most dots you may buy in each of your skills rises by 1."
"Obsidian Claws" = "With Feral Claws, make Brawl attacks from up to three steps per dot of Athletics by flinging obsidian claws (not to grapple, trip, stake or disarm); regrowing them takes a simple action."
"Old Habits" = "Gain up to 3 points of Sabbat-only merits free, as your Storyteller allows; not ones that need you to hold a Sabbat position."
"Pack Player" = "+3 to Physical attacks on anyone who hurt a packmate you share a vinculum of 3 or more with in the last three turns, and once a turn a simple action moves you five steps to such a packmate's side."
"Painfully Shy" = "Anyone who sees through your Obfuscate takes 1 aggravated damage that cannot be reduced, and if you fight them straight away you gain +3 initiative."
"Parley" = "Once a month, call on contacts across sects, independents included, for a service such as a rumour from another sect."
"Path Adherent" = "The benefits of a Path of Enlightenment Morality merit, as someone new to the path: its level 1 and level 4 sins count one level worse, and you do not gain the expanded path rules."
"Path of Blood" = "Follow the Path of Blood instead of Humanity: the Assamite creed of rendering Haqim's judgment on other vampires."
"Path of Caine" = "Follow the Path of Caine instead of Humanity: purge your humanity and study Caine and Enoch for signs of his return. Adherents should know some Lore of the Book of Nod."
"Path of Cathari" = "Follow the Path of Cathari instead of Humanity: vampires as Caine's testers of a wicked world, tempting mortals with vice."
"Path of Chivalry" = "Follow the Path of Chivalry instead of Humanity, as a noble born to rule. No Beast traits for sins committed defending the innocent or upholding the cardinal virtues."
"Path of Death and the Soul" = "Follow the Path of Death and the Soul instead of Humanity: a scholar's path devoted to understanding death and what lies beyond it."
"Path of Ecstasy" = "Follow the Path of Ecstasy instead of Humanity, sating the Beast through pleasure as worship of Set. No Beast traits for sins committed pursuing hedonistic pleasure."
"Path of Entelechy" = "Follow the Path of Entelechy instead of Humanity: the old Brujah ideal of mastering inner strength, courage and self-control to keep the Beast from ruling you."
"Path of Evil Revelations" = "Follow the Path of Evil Revelations instead of Humanity, serving demons and spreading evil for infernal reward. Hated and feared by the Camarilla and Sabbat alike."
"Path of Feral Heart" = "Follow the Path of Feral Heart instead of Humanity, embracing the Beast and the predator's instincts over civilisation."
"Path of Harmony" = "Follow the Path of Harmony instead of Humanity, balancing intellect and the Beast like predator and prey. No Beast traits for sins committed to keep that balance."
"Path of Heaven" = "Follow the Path of Heaven instead of Humanity, seeing the Beast as the tempter and seeking God's forgiveness. No Beast traits for sins committed in religious duty."
"Path of Honorable Accord" = "Follow the Path of Honorable Accord instead of Humanity: a strict code of duty, honour and courage."
"Path of Lilith" = "Follow the Path of Lilith instead of Humanity, revering Lilith over Caine and seeking wisdom through pain. Heretical in many eyes, so best kept hidden."
"Path of Metamorphosis" = "Follow the Path of Metamorphosis instead of Humanity, carving away everything human to become something more perfect."
"Path of Night" = "Follow the Path of Night instead of Humanity, tormenting the good and spreading fear of the night. No Beast traits for sins committed to shock others with your evil."
"Path of Nocturnal Redemption" = "Follow the Path of Nocturnal Redemption instead of Humanity: vampires as dark angels scourging sin, cycling between indulgence and redemption."
"Path of Orion" = "Follow the Path of Orion instead of Humanity: a hunter's creed of overcoming the strongest foes, and the Beast. No Beast traits for sins committed pursuing your prey."
"Path of Paradox" = "Follow the Path of Paradox instead of Humanity, the Ravnos path of seeing through illusion to the truth beneath."
"Path of Power and the Inner Voice" = "Follow the Path of Power and the Inner Voice instead of Humanity: a path of ambition, command and the will to rule."
"Path of Scorched Heart" = "Follow the Path of Scorched Heart instead of Humanity, burning away emotion to master the Beast through cold logic."
"Path of the Hive" = "Follow the Path of the Hive instead of Humanity: the Baali Abelenes, shepherds who keep the slumbering demons imprisoned."
"Path of Typhon-Set" = "Follow the Path of Typhon-Set instead of Humanity, serving Set and working toward his return."
"Piece That Remains" = "Take one 1- or 2-point clan merit of another clan free (not a bloodline, nor one that grants disciplines or paths). Losing this merit loses that one too."
"Pierce the Veil" = "You always have a character's Gaze and Focus unless they have a power that prevents it, and your Chimerstry and Auspex attacks do not count toward a target's attack limit for the round."
"Polymorphic Demeanor" = "At the start of each game, change your archetype and one attribute focus; they return at the end of the game."
"Power Broker" = "Once a month, swap any or all of your influence specialisations for the month."
"Power Object" = "An object you believe has power gives +2 wild card to one skill you choose while you hold or wear it."
"Preternatural Awareness" = "Use your Awareness in place of Investigation, Stealth or Dodge, though not to gain those skills' own special rules."
"Primacy of the Blood" = "Dominate of any kind used on you by a vampire of weaker generation automatically fails."
"Prodigy of the Flesh" = "Learn up to 5 dots of Vicissitude without a teacher."
"Quick Caster" = "When you declare a Thaumaturgy power in combat, add your Occult dots to your initiative."
"Quixotic" = "No penalty at 0 Willpower, and with fewer than 3 Willpower you count as 3 for your defense test pools."
"Rare Clan" = "Your clan is very rarely seen in the chronicle; you may be treated as an outsider or shunned."
"Renaissance Mindset" = "With the means to research, a downtime action swaps one Academics, Linguistics or Lore specialisation for another."
"Rending" = "When a claw or fang attack hits a vampire, they also lose 1 Blood (2 on an exceptional success), even if Fortitude stops the damage."
"Restricted Clan" = "Play a clan or bloodline not suited to the setting, or a combination costing more than 7 merit points. Needs the Storyteller's permission."
"Rhythm of Battle" = "Use your Social attribute for initiative instead of the higher of Physical or Mental; ties with equal Physical or Mental go after them."
"Ritual Fluency" = "Learn rituals of any blood magic, Necromancy, Koldunic Sorcery and Abyss Mysticism included, through their Thaumaturgy equivalents. They count toward your ritual limit."
"Ritual Master" = "A Giovanni may buy twice as many Necromancy rituals as their Necromancy dots, a Tremere twice as many Thaumaturgy rituals as their Thaumaturgy dots. Once only; may be taken with the clan's Expertise."
"Ritual Supremacy" = "Buy rituals at their rating x1 XP. May be taken alongside Thaumaturgic Expertise."
"Runic Woads" = "Inscribe a blood rune of the Lhiannan's lost Ogham, such as the war-spirit Crimson Woad, for its lasting benefit. One woad at a time; changing it takes a downtime ceremony in your territory."
"Rush of Battle" = "The first Blood you spend on Celerity each turn does not count toward your per-turn limit, and each Celerity power you activate heals one level of normal damage."
"Sage of the Spirits" = "A powerful nature spirit serves you as a rating 5 Retainer. If it is destroyed, a heroic quest can win another."
"Sanguine Anointing" = "Spend 1 Blood and a simple action to give one weapon an extra quality for an hour: Accurate, Armor Piercing or Brutal for melee, or Automatic, Fast or Long Range for ranged. Only you get the extra quality."
"Sanguine Indulgence" = "Spend Blood equal to your Beast traits and five standard actions to lower your Beast traits by 1, unless you have already reached 5."
"Scholomonariue" = "You may not learn Thaumaturgy, but may buy Thaumaturgy rituals for each dot of Auspex (techniques and elder powers included), with Auspex as your primary path."
"Scion of Death" = "Your Fourth Horseman summons a demonic steed (a rating 4 Stock NPC, immune to Animalism and Necromancy). Mounted, its radius grows to five steps and you move twice as far."
"Sea Witch" = "Buy Thaumaturgy: Path of Neptune's Might at out-of-clan cost."
"Seasoned Traveler" = "Gain 3 dots of Streetwise or Survival free, and the most you may buy of both rises by 2. Merely passing through, you travel unmolested."
"Seekers of the Hidden" = "Gain Spiritus as a fourth in-clan discipline, with no free dots. Cannot be combined with other merits that add in-clan disciplines."
"Serpentine Embrace" = "Your grapples do not have their damage reduced, and once an hour a grapple costs no Willpower."
"Shady Dealings" = "Attacking another's influence takes 1 influence action per point removed instead of 2, and quests to undermine a Stock Location are 2 easier (minimum 1)."
"Shedding the Snake's Skin" = "A standard action tearing off your face's skin heals 3 damage (aggravated first), ends powers holding you such as Summon or Blood Contract, and resets Familiarity others have with you."
"Shrinking Violet" = "Buy one Obfuscate elder power or technique your generation would otherwise bar (not the luminary power): elder powers at 20 XP, techniques at 12 XP, prerequisites still apply."
"Sight Beyond Sight" = "Once per game, spend 1 Blood before an Auspex challenge to succeed outright, or after winning one to make it exceptional. You then have the Death Sight flaw for an hour."
"Skullduggery" = "+2 wild card to attacks on targets with lower initiative than you, and your Streetwise dots count toward an exceptional success against them."
"Social Elite" = "Gain the Reputation merit and one merit of your sect free: Moniker or Wild One (Anarch), Machiavellian Prodigy or Social Nobility (Camarilla), or a Sabbat order such as Black Hand Membership."
"Songs Beyond Mortal Ken" = "When Madrigal bolsters others, you may also give them +2 wild card to defend against all hostile blood magic."
"Soul Economy" = "Wraiths you summon with the Sepulchre Path come in at 1 rating higher than the power allows."
"Soul of the Wyld" = "Spirits treat you favourably, and you may buy werewolf gifts of the auspice of the moon you were Embraced under."
"Spellslinger" = "Choose one Thaumaturgy path: +4 wild card to your attack test pools when using its powers directly in combat."
"Spirit Guide" = "Gain Totem 2, a werewolf-style spirit totem (Blood in place of Gnosis); with Storyteller permission, raise it to 5."
"Spiritual Animist" = "Path of Elemental Mastery powers cost you no Blood and can last twice as long, and spirits you summon or things you animate gain +2 Stock NPC rating."
"Strength of Honor" = "Gain Potence as an extra in-clan discipline, as with Additional Common Discipline."
"Strength of Madness" = "Anyone who tastes your blood shares your derangements for 24 hours, or for good after three nights in a row. +2 wild card to attacks against anyone with a derangement."
"Subtle as Hell" = "Your infernal fires burn like ordinary flame, and while your Infernal Power gifts are active your aura shows no infernal taint."
"Talismonger" = "A downtime action and 1 Blood bind a level 1 or 2 Thaumaturgy ritual into a small talisman to be used later."
"Thaumaturgic Expertise" = "Learn another Thaumaturgy path without a teacher at in-clan cost, though it is not in-clan. May be bought more than once."
"Thaumaturgically Gifted" = "You may buy two more paths of Thaumaturgy. Once only."
"The Beast Within" = "Shape of the Beast's fight form, or another major transformation, can be a near-human beast form that keeps its benefits but can still use weapons; Brawl bonuses also apply to Melee and Athletics attacks."
"The Blade Whisper" = "Targets of your opposed challenges cannot be helped by Assist Defender, and anyone who tries loses the action."
"The Duty of Kings" = "Your Willpower retests in opposed Social challenges cost no Willpower."
"The Friendly Folk" = "Choose a changeling Art (Dread, Metamorphosis, Skullduggery or Soothsay), for good: buy its cantrips up to the third level at out-of-clan cost, paying Blood instead of Glamour."
"The Heart of the Matter" = "You can Pierce the Heart of a vampire with damage in their Injured track, not only Incapacitated."
"The Judge's Resilience" = "+2 wild card to defend against all Thaumaturgy, and your Willpower retest against it costs no Willpower. No help against Necromancy."
"The Man in Black" = "Status bans hit you one degree lighter, negative status never censures you, and you learn when someone investigates your Alternate Identity."
"The Master's Path" = "The benefits of Golconda Seeker with two choices from its list instead of one (lost only while your Humanity is below its threshold), and a measure of resistance to your Beast."
"Timely Intervention" = "+1 wild card to initiative for each Temporis power you have."
"To Catch A Killer" = "After three standard actions studying a murder scene, track the killer by Mental + Occult instead of Survival, without needing scent or Heightened Senses."
"To the Manor Born" = "Gain Code of Honor with a code of your choosing, and optionally the Path of Honorable Accord or Path of Chivalry merit at no cost."
"Touched by an Angel" = "Mortals you help or protect with Obeah take you for a figure of their faith, or a benign psychic, and keep your secret, unless they see you do harm."
"Trials of the Blood" = "Buy one Auspex elder power or technique your generation would otherwise bar (not the luminary power): elder powers at 20 XP, techniques at 12 XP, prerequisites still apply."
"Trusted Confessor" = "Ten minutes of honest confession with you lowers someone's Beast traits by 2, or 3 if you have Animal Ken."
"Typhonic Beast" = "Form of the Cobra can instead give you the jackal-headed form of Set's beast, with the benefits of Form of the Cobra and Skin of the Adder together."
"Uncommon Clan" = "Your clan is uncommon in the chronicle's setting; you may be something of an outsider, with fewer benefits than its proper members."
"Ventrue Royalty" = "Gain 9 free dots across Allies, Contacts, Fame, Haven, Herd, Influence or Resources, as 4, 3 and 2 in three of them."
"Visceral Artisan" = "Use Vicissitude in your Crafts to make disturbingly living objects with one function, such as a book that reads itself, at the cost of Beast traits at your next game."
"Voudoun Master" = "Learn Necromancy: Bone Path and one other Necromancy path (not Mortis) without a teacher, at out-of-clan cost."
"Vozhd" = "Turn one of your Retainers into a Vozhd, a war-beast of flesh: +3 Stock NPC rating, an Animal Retainer trait, two Physical focuses, and growth in size."
"Walking Dead" = "Raise an intelligent zombie Retainer (rating 5, with a Fortitude or Obfuscate specialisation) that can help with downtime actions."
"Web of Knives" = "Gain Potence as an extra in-clan discipline and the Path of Blood merit free, bound by a blood oath of loyalty to the Web of Knives."
"Whispers from Beyond" = "Once per game for each dot of Occult, the Loa take you over for a turn, raising one skill to 5 dots."

[flaws]
"Derangement" = "You suffer a derangement, a lasting mental disorder; name it in the trait's detail."
