# Local development database. `docker compose up -d`, then run migrations from backend/.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: horatio
      POSTGRES_PASSWORD: horatio
      POSTGRES_DB: horatio
    ports:
      # Not 5432, so it does not clash with a Postgres already running locally.
      - "54329:5432"
    volumes:
      - db-data:/var/lib/postgresql

  # Catches mail Horatio sends while developing: SMTP on 1025, a web inbox on
  # http://localhost:8025. start-local.sh points Horatio at it.
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
