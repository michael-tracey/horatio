# The starting template a troupe offers for its backstory questions (issue #343),
# loaded by horatio.backstories.load_template when a troupe chooses it. The
# questions are a troupe's own, verbatim; "{troupe}" becomes the troupe's name.
#
# Each set has a name and its questions in order. Each question has:
#   text       its words
#   kind       long, short, year, choice, scale or heading
#   title      optional: the short title its section's heading uses instead
#   hint       optional
#   optional   true for a question that need not be answered (default false)
#   options    a choice's options, or a scale's two poles
#   condition  optional: when it is shown, { kind = "social_age", ages = [...] },
#              { kind = "sect", sects = [...] } or
#              { kind = "trait", category = "backgrounds", name = "..." }

[[sets]]
name = "Short Form"

[[sets.questions]]  # 1
