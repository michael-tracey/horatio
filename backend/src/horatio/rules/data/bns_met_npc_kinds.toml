# NPC kinds: what an NPC is, for NPCs of every kind built on the Vampire rule set
# (issue #215). From MET: VTM ch. 12, "Allies and Antagonists", pp. 489–505: the
# book's quick rules for using other creatures in a Vampire chronicle, as Stock
# NPCs (pp. 489–490). Read by horatio.rules.npc_kinds; not part of any rule set,
# so nothing here changes what a character can buy.
#
# [[kinds]]
#   key, name     the kind's key and the name shown for it.
#   group         where it is listed: "vampire", "mortal", "hunter",
#                 "supernatural" or "bloodline".
#   nature        "mortal", "partly_mortal" (a ghoul) or "supernatural". Mortals
#                 take skill specializations only, unless the kind lists numina or
#                 powers (p. 489).
#   page          the page its rules start on; `to_page` the last, if more.
#   resource      { name, size, per_turn, regains? }: what it spends on its powers.
#                 Left out, it is Blood: 5 for a mortal or partly mortal NPC, 10
#                 for a supernatural one, 1 a turn (p. 490); a mortal cannot spend
#                 its Blood (per_turn 0), as only ghouls can.
#   specializations
#                 what its discipline specializations may be: "any" for any
#                 discipline or path in the Vampire rule set, or a list of names.
#                 "Thaumaturgy: *" means any Thaumaturgy path. Left out, none.
#   specialization_label
#                 what the book calls those for this kind ("Hedge Magic").
#   [[kinds.numina]]
#                 numina of its own, not in the Vampire rule set, it can take as a
#                 specialization: { name, page, levels = [what each dot does] }.
#   [[kinds.powers]]
#                 what every NPC of the kind has: `dots` of a discipline (a number,
#                 or "rating" for its NPC rating), or a power or merit by `name`,
#                 with the `discipline` it belongs to or its `category`. `from_rating`
#                 makes it come only at that rating or above. `note`: in our words.
#   health_per_rating
#                 health levels for each point of rating (1 if left out, p. 490).
#   rating_max    the highest NPC rating it can have (5 if left out, p. 489).
#   notes         its special rules, short and in our own words.

# --- Vampires and ghouls (pp. 489–490) ---------------------------------------

[[kinds]]
key = "vampire"
name = "Vampire"
group = "vampire"
nature = "supernatural"
page = 489
to_page = 490
specializations = "any"
notes = [
  "A Stock vampire is built as any Stock NPC is; the sample is Nemian the Nosferatu, rating 4 (p. 490).",
]

[[kinds]]
key = "ghoul"
name = "Ghoul"
group = "vampire"
nature = "partly_mortal"
page = 489
to_page = 490
specializations = "any"
notes = [
  "Partly mortal: 5 Blood, which a ghoul, unlike other mortals, can spend on its powers (p. 490).",
]

