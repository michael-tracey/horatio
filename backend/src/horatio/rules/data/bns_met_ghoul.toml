# By Night Studios Mind's Eye Theatre: Vampire — ghoul player characters.
#
# A ghoul is a mortal fed on a vampire's blood and bound to that vampire, its
# domitor (MET: VTM pp. 296–297, "Playing a Ghoul"). It is built as a vampire is
# (p. 84), with these differences:
#
#   - no clan of its own: its sheet holds its domitor's clan and bloodline, and it
#     pays for them as a vampire would, rarity and bloodline merits included;
#   - no Generation, at creation or after;
#   - 5 dots of disciplines, all in its domitor's in-clan disciplines (a Caitiff
#     domitor's are the three it chose) and in powers its domitor has; dots it
#     cannot place at creation can be saved for later;
#   - no clan merits but those its domitor's clan and bloodline need, no Morality
#     merits, and nothing about the vampiric condition;
#   - its own XP costs (below); disciplines cannot be bought with XP;
#   - no Humanity, Path, Beast, techniques or elder powers (p. 297).
#
# The trait catalogue, checks and grants are the vampire's, less what a ghoul
# cannot have (`leave_out`).
#
# Facts a Ghoul cost rule's condition can test:
#   in_clan      whether this trait is one of the domitor's clan's in-clan disciplines,
#                or for a Caitiff domitor, one of the three it chose
#   clan         the clan or bloodline exactly ("Brujah: True Brujah")
#   clan_family  the clan ("Brujah")

key = "bns-met-ghoul"
splat = "ghoul"
name = "BNS MET Ghoul"
version = 1

# As for a vampire (pp. 106–107).
starting_xp = 30
banked_xp = 5

# The vampire's clans (in its rule set file) and the rest of its catalogue, sect
# status included.
trait_files = ["bns_met_vampire.toml", "bns_met_vampire_traits.toml", "bns_met_vampire_status.toml"]

# The ghoul's own checks first, so a discipline a ghoul cannot take says why in a
# ghoul's words before the vampire's.
check_files = ["bns_met_ghoul_checks.toml", "bns_met_vampire_checks.toml"]

grant_files = ["bns_met_vampire_grants.toml"]

# A ghoul's equipment is a vampire's (MET: VTM pp. 515-524).
equipment_file = "bns_met_vampire_equipment.toml"

# Downtime action kinds and allowances are the vampire's.
borrow = { action_kinds = "bns_met_vampire.toml", allowance_rules = "bns_met_vampire.toml" }

# Traits a ghoul cannot have, left out of the files above along with the checks
# and grants about them: Generation (p. 296); Humanity and the Paths, techniques and
# elder powers (p. 297); and the extra in-clan disciplines a vampire chooses or
# merits give (a Caitiff domitor's three have a category of their own, below).
leave_out = [
  { category = "backgrounds", name = "Generation" },
  { category = "paths" },
  { category = "techniques" },
  { category = "elder_disciplines" },
  { category = "luminary_disciplines" },
  { category = "extra_in_clan_disciplines" },
]

