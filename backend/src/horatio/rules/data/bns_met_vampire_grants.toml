# Traits that give a Vampire other traits (horatio.rules.grants). Page numbers
# are MET: Vampire The Masquerade (core) unless they name a volume. Where the
# player chooses what is granted, the source trait's detail names it
# ("Resources", "Performance: Singing").
#
# A merit or flaw that only changes how something works, without giving a trait,
# is listed under `rules_only` at the end instead, for staff to apply by hand;
# tests/test_grants_data.py keeps every trait that says it gives another in one
# list or the other.

