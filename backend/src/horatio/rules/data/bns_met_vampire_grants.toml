# --- powers past the Generation (p. 101) ---------------------------------------------
# One power of a discipline the character's Generation bars: an elder power for a
# Neonate or Ancilla, a second for a Pretender Elder, a technique for a Master or
# Luminary Elder; never the luminary power. It costs 20 XP an elder power, 12 a
# technique, and the other prerequisites still apply. The checks set aside are the
# three Generation checks of bns_met_vampire_checks.toml (p. 101): a Pretender
# Elder's one elder power, a Neonate's or Ancilla's none, a Master's or Luminary's
# no techniques.

