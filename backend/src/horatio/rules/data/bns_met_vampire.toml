# ---------------------------------------------------------------------------
# Downtimes.
#
# PLACEHOLDERS: neither Yorick nor the troupe's old downtime tool recorded the
# official allowance rules, so these numbers are a starting point for each
# troupe's storytellers to house-rule, not the rulebook.
#
# An action kind is a category of downtime action; each action question on a
# downtime form spends actions of one kind. Allowance rules add up: the rule
# with no trait is the base everyone gets, and each matching trait adds more.

[[action_kinds]]
key = "general"
name = "Downtime action"

# Influence: each dot is one action a month, of its own type (MET: VtM core,
# pp. 509–515). An answer names one of the kind's actions, by key. A general
# action has a level, and needs a rating at least that, or one less with a
# specialisation of the type (p. 512). A conflict action is a targeted action.
[[action_kinds]]
key = "influence_elite"
name = "Elite influence action"
fields = [
  { key = "specialization", label = "Specialisation", type = "trait", category = "influence_elite_specializations" },
  { key = "action", label = "Action", type = "influence_action" },
]
actions = [
  { key = "a_friend_in_need", name = "A Friend in Need", level = 1 },
  { key = "gossip_and_insider_trading", name = "Gossip and Insider Trading", level = 2 },
  { key = "bureaucratic_errors", name = "Bureaucratic Errors", level = 3 },
  { key = "smooth_over", name = "Smooth Over", level = 4 },
  { key = "no_party_crashers", name = "No Party Crashers", level = 5 },
  { key = "everything_has_a_price", name = "Everything Has a Price", level = 6 },
  { key = "private_collection", name = "Private Collection", level = 7 },
  { key = "pop_star_meltdown", name = "Pop Star Meltdown", level = 8 },
  { key = "the_power_behind_the_throne", name = "The Power Behind the Throne", level = 9 },
  { key = "regional_influence", name = "Regional Influence", level = 10 },
  # Targeted actions (p. 510): no level, and paid from either type for a Block (p. 511).
  { key = "attack", name = "Attack", conflict = true },
  { key = "block", name = "Block", conflict = true },
  { key = "boost", name = "Boost", conflict = true },
