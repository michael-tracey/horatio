# By Night Studios Mind's Eye Theatre: Vampire — the generic rule set.
#
# Costs reproduce Yorick's BNSMETV1_VampireCosts engine, checked case by case
# against its output (backend/tests/fixtures/yorick_vampire_costs.json.gz).
# One deliberate difference: where Yorick charged a sentinel 9999 or 99999 XP
# per dot to make a trait unaffordable, these rules say `not_allowed`.
#
# Facts a Vampire cost rule's condition can test:
#   generation  the character's Generation background rating, or 1 without one
#   in_clan     whether this trait is one of the character's in-clan disciplines
#
# Schemes:
#   per_dot      each dot costs `rate`
#   progressive  dot n costs n × `rate`
#   table        dot n costs `table[n-1]`
#   fixed        the trait costs `rate` in total
#   free         costs nothing
#   not_allowed  cannot be bought

key = "bns-met-vampire"
splat = "vampire"
name = "BNS MET Vampire"
version = 1

# Experience a new character starts with (Yorick: initial_xp).
starting_xp = 30

# Unspent creation XP a character keeps when its first home troupe accepts it;
# the rest is lost (p. 107).
banked_xp = 5

# Further [[traits]] tables, loaded as part of this rule set; the status file also
# has the sects' status rules and what each title gives (horatio.rules.status).
trait_files = ["bns_met_vampire_traits.toml", "bns_met_vampire_status.toml"]

# What a sheet may hold, beyond what it costs (horatio.rules.checks).
check_files = ["bns_met_vampire_checks.toml"]

# Traits that give other traits (horatio.rules.grants).
grant_files = ["bns_met_vampire_grants.toml"]

# Equipment: its kinds, grades and qualities, and the book's sample items
# (horatio.rules.equipment).
equipment_file = "bns_met_vampire_equipment.toml"

# ---------------------------------------------------------------------------
# Categories, in sheet order. max_rating is the highest rating a trait can
# reach; unrated categories hold one choice (such as a clan) rather than dots.

[[categories]]
key = "clan"
name = "Clan"
group = "Identity"
rated = false

[[categories]]
key = "archetype"
name = "Archetype"
group = "Identity"
rated = false

[[categories]]
key = "sect"
name = "Sect"
group = "Identity"
rated = false

[[categories]]
key = "faction"
name = "Faction"
group = "Identity"
rated = false
# Only Sabbat vampires have a faction.
requires = { category = "sect", name = "Sabbat" }

[[categories]]
key = "attributes"
name = "Attributes"
group = "Attributes"

[[categories]]
key = "focus_physicals"
name = "Physical Focus"
group = "Attributes"
# One focus per attribute (p. 90); merits can grant more.
max_held = 1
# After creation, swapping the focus for another costs this much (p. 90).
change_cost = 10

[[categories]]
key = "focus_mentals"
name = "Mental Focus"
group = "Attributes"
# One focus per attribute (p. 90); merits can grant more.
max_held = 1
# After creation, swapping the focus for another costs this much (p. 90).
change_cost = 10

[[categories]]
key = "focus_socials"
name = "Social Focus"
group = "Attributes"
# One focus per attribute (p. 90); merits can grant more.
max_held = 1
# After creation, swapping the focus for another costs this much (p. 90).
change_cost = 10

[[categories]]
key = "health_levels"
name = "Health Levels"
group = "Expended"
# Worked out from the rest of the sheet (starting values, merits, flaws,
# Fortitude); never bought or set by hand.
derived = true

[[categories]]
key = "willpower_sources"
name = "Willpower"
group = "Expended"
# Worked out from the rest of the sheet (starting values, merits, flaws,
# Fortitude); never bought or set by hand.
derived = true

[[categories]]
key = "skills"
name = "Skills"
group = "Skills"
max_rating = 10
# Skills are bought up to 5; merits and generation can raise that (pp. 91, 101).
usual_max = 5

[[categories]]
key = "lore_specializations"
name = "Lore Specializations"
group = "Skills"
# Specialisations of Lore, shown under it.
specializes = { category = "skills", name = "Lore" }

[[categories]]
key = "academics_specializations"
name = "Academics Specializations"
group = "Skills"
# Specialisations of Academics, shown under it.
specializes = { category = "skills", name = "Academics" }

[[categories]]
key = "drive_specializations"
name = "Drive Specializations"
group = "Skills"
# Specialisations of Drive, shown under it.
specializes = { category = "skills", name = "Drive" }

[[categories]]
key = "linguistics_specializations"
name = "Languages"
group = "Skills"
# Specialisations of Linguistics, shown under it.
specializes = { category = "skills", name = "Linguistics" }

[[categories]]
key = "disciplines"
name = "Disciplines"
group = "Disciplines"
# Learning a dot takes a downtime action between games (pp. 111, 113, 224);
# Efficient Learner waives it (p. 249).
downtime_actions = 1
downtime_waived_by = [{ category = "merits", name = "Efficient Learner" }]

[[categories]]
key = "techniques"
name = "Techniques"
group = "Disciplines"
# Learning a dot takes a downtime action between games (pp. 111, 113, 224);
# Efficient Learner waives it (p. 249).
downtime_actions = 1
downtime_waived_by = [{ category = "merits", name = "Efficient Learner" }]

[[categories]]
key = "elder_disciplines"
name = "Elder Disciplines"
group = "Disciplines"
# Learning a dot takes a downtime action between games (pp. 111, 113, 224);
