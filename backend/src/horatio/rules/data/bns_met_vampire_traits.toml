[[traits]]
category = "rituals"
name = "Abyssal: Abyssal Ichor"
description = "1 Blood and cephalopod ink cut with an obsidian or jet blade: a vial of ichor, used as ink only the supernatural can read, as an oil that makes an item Nondescript, or as a tasteless poison (3 doses). Up to 5 vials a downtime action."
page_reference = "Vol. 2, p. 100"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Abyssal: Adornment of Ashes"
description = "1 Blood and a rune of black hardwood ash on your body: for the night, inside your Shroud of Night, no power needing Gaze and Focus can target you, though you can still use yours. Marring the rune (a Disarm) ends it."
page_reference = "Vol. 2, p. 108"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Abyssal: Affliction of the Void"
description = "1 Blood and one of your own teeth: for the night your jaw becomes a maw that bites without a Grapple (a breach of the Masquerade); Blood you drink feeds the Abyss, so no blood bond, and vampire blood heals you 1 normal damage. End it with a Willpower and a pulled tooth."
page_reference = "Vol. 2, p. 111"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Abyssal: Avatar of Screams"
description = "1 Blood, cutting out your tongue for a tiny Arm of the Abyss: each Dominate power you win also deals 1 unsoakable aggravated damage (2 on an exceptional success), without breaking Forgetful Mind; the target avoids it by relenting."
page_reference = "Vol. 2, p. 113"
properties = { rating = 5 }

[[traits]]
category = "rituals"
name = "Abyssal: Bind the Shadow"
description = "1 Blood and silver tools to cut away the shadow of a helpless or willing target: while you keep it, +3 to Dominate and Abyss Mysticism against them, and no shadow powers work on or for them, for a year and a day."
page_reference = "Vol. 2, p. 111"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Abyssal: Cassandra's Folly"
description = "Once a month, 1 Blood and an instrument burnt in an ethylene flame: you or a willing subject gain Oracular Ability (or a further use of it) for the night, but cannot communicate anything true at all, by any means."
page_reference = "Vol. 2, pp. 111-112"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Abyssal: Clasp of Shadow"
description = "Sever and eat up to 3 Arms of the Abyss (lowering your maximum by each): that night, once per arm, a simple action while Grappling leaves a shadow copy with 3 health levels holding the Grapple as you step away."
page_reference = "Vol. 2, p. 100"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Abyssal: Coagulated Darkness"
description = "A downtime action and Blood up to your Obtenebration powers, left three nights in the dark, then eaten: for one game, that many extra Blood, spent only on Physical tests or healing in torpor, beyond your per-turn limit."
page_reference = "Vol. 2, p. 101"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Abyssal: Dark Hand that Feeds"
description = "5 minutes and 2 Blood at a metal sigil: summon a Shadow Fiend, a level 3 Stock NPC with a 5 Blood pool, that obeys you for the night, spying, fetching, reporting by telepathy and fighting. One at a time."
page_reference = "Vol. 2, p. 101"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Abyssal: Echoes in Darkness"
description = "A tiny shadow from Shadow Play in a willing target's ear: for up to 30 days, alone in a dark room and saying your name, they can whisper back and forth with you. Up to your Occult dots of targets at once."
page_reference = "Vol. 2, p. 104"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Abyssal: Ensnared Mind"
description = "1 Blood, burning the target's name, opposed Abyss test: that night, scattering the embers (simple action) within a mile leaves them unable to tell friend from foe for an hour: no relenting, no designating allies, no Assist maneuvers but Assist Defender. One at a time."
page_reference = "Vol. 2, p. 108"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Abyssal: Feasts of Famine"
description = "10 minutes and 1 Blood, slitting your fingertips: for the night, your Arms of the Abyss have mouths and can feed from a target they Grapple, as if you drank (blood bonds and poisons included)."
page_reference = "Vol. 2, p. 104"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Abyssal: Filaments of Catharsis"
description = "Cast in place of the 5 turns' chant for Walk the Abyss: the journey takes 15 minutes on a win, 30 on a tie and an hour on a loss; or, alone and within 5 miles, take 2 unreducible aggravated damage to arrive in a minute with no test."
page_reference = "Vol. 2, p. 102"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Abyssal: Gloom Sentinel"
description = "1 Blood, once a night: shape a sentinel from a shadow and, with a simple action, call it out of any shadow to Assist Defender you with traits of twice your Obtenebration dots, until its 3 health levels are gone."
page_reference = "Vol. 2, p. 109"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Abyssal: Helping Hands"
description = "1 Blood, submerged, strangling a living creature: the next time you summon your Arms of the Abyss, each gives +3 instead of +1 when it uses Assist Attacker, one arm to an attacker."
page_reference = "Vol. 2, p. 112"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Abyssal: Incarnation of Madness"
description = "1 Blood and an offering deep in the Abyss, taking Nightmares: for 30 days, no one who attacks you gets a surprise action, and anyone who uses Gaze and Focus on you in Black Metamorphosis or Tenebrous Form is blinded, yet you keep their Gaze and Focus."
page_reference = "Vol. 2, p. 113"
properties = { rating = 5 }

[[traits]]
category = "rituals"
name = "Abyssal: Maeljin Urge"
description = "1 Blood, shattering a mirror, to trap an Urge (a derangement from the book's table), then 1 Blood to pass it by touch: each holder suffers it for 10 minutes and gains a Derangement trait, then must pass it on, until the night ends."
page_reference = "Vol. 2, pp. 114-115"
properties = { rating = 5 }

[[traits]]
category = "rituals"
name = "Abyssal: Mapping the Abyssal Pathway"
description = "1 Blood for sigils painted before Walk the Abyss: you and your companions take half damage (rounded down) from the Abyss, and you can take six companions instead of three."
page_reference = "Vol. 2, p. 102"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Abyssal: Memories Lost"
description = "15 minutes and 1 Blood at a dark reflection: cast up to 15 minutes of memory into the Abyss for good, maybe getting a painful random one back (often, Nightmares); or seek lost memories, by a Complex quest for yours or an Epic one for another's."
page_reference = "Vol. 2, p. 109"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Abyssal: Oubliette"
description = "A crystal soaked a day in shadow and 1 Blood: in your Shroud of Night, a simple and a standard action seal an unconscious or torpid body inside it, stable and out of reach of Telepathy, until it's broken (2 health levels) or released. Up to your Occult dots of crystals."
page_reference = "Vol. 2, p. 115"
properties = { rating = 5 }

[[traits]]
category = "rituals"
name = "Abyssal: Palace of Tenebrae"
description = "10 minutes and 1 Blood smearing runes on your haven's floor: for the night anyone but an Abyss Mystic overlooks the building (not a public place like Elysium), and Walk the Abyss reaches it in half the time. One at a time."
page_reference = "Vol. 2, p. 105"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Abyssal: Psychic Void"
description = "1 Blood and 20 minutes under saltwater: until the night ends you leave no psychic impression for Spirit's Touch and the like, object spirits can't recall you, and you get a +3 wild card against Auspex and like mental powers."
page_reference = "Vol. 2, p. 112"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Abyssal: Shadow Tempering"
description = "1 Blood to reforge a weapon's shadow with a silver hammer: for a year, a two-handed weapon (Brutal, Long Range) needs one hand, and a one-handed one gains Balanced, beyond its quality limit."
page_reference = "Vol. 2, p. 103"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Abyssal: Shadow Transgressor"
description = "1 Blood on a pair of shoes you stole this week: once, wearing them, a simple action swaps places with one of your visible Arms of the Abyss, either of you taking over the other's Grapple. Neither of you may be Grappled."
page_reference = "Vol. 2, p. 105"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Abyssal: Shadowy Sanctum"
description = "1 Blood to coat a room of your haven in shadow: meditating there regains 1 Willpower every 5 minutes, and Walk the Abyss to it takes 10 minutes with no damage. One at a time."
page_reference = "Vol. 2, p. 110"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Abyssal: Sin Collector"
description = "1 Blood, smashing an icon in water: for the night, each free sin near you that earns a Beast trait gives you back up to 1 Blood and 1 Willpower (5 in all), or a lost point of morality in sight gives 5 Blood and all your Willpower and ends it."
page_reference = "Vol. 2, p. 106"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Abyssal: Smothering Darkness"
description = "1 Blood, pinching out a ring of candles: for the night, your Shadow Play (a simple action) can snuff out lights in sight up to campfire size; a supernatural light needs Social + Occult against its power's pool."
page_reference = "Vol. 2, p. 103"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Abyssal: Void's Vesicle"
description = "1 Blood and a creature that has never seen light: for the night, use your total Obtenebration dots (techniques and elder powers too) in place of Stealth, but you gain Eerie Presence and are a breach of the Masquerade in light."
page_reference = "Vol. 2, p. 106"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Abyssal: What Once Was Lost"
description = "1 Blood, standing still in the Abyss: seek an item you or a companion held for 30 days that is lost (not destroyed or held by someone); if the Storyteller allows, a quest of difficulty 1 to 5 by how long it's been lost recovers it, or one like it."
page_reference = "Vol. 2, pp. 106-107"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Abyssal: Whispers in the Dark"
description = "An hour in darkness flogging yourself (1 Blood and 1 unsoakable normal damage): write a question in the blood and the Abyss writes an answer, on general subjects only, never personal secrets, as the Storyteller decides."
page_reference = "Vol. 2, p. 110"
properties = { rating = 3 }

# Dark Thaumaturgy (issue #414): infernal rituals a thaumaturge may take as
# Thaumaturgy rituals, from the V20 LARP SRD, not one of our books. Each cites its
# page on the SRD; the summaries are our own words. Their checks are in
# bns_met_vampire_checks.toml, at "Dark Thaumaturgy".

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Allies Below"
description = "Bury a finger and whisper your plan: tonight, the first retest you win with Willpower on that plan gives the Willpower back, and your aura shows infernal taint for 5 minutes. Win none, and you wake without your hand."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/allies-below"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Apport Object"
description = "Mark a small object of yours, no bigger than a sword, with an infernal sigil and hide it; saying its secret phrase later brings it to your hand. Up to your Occult dots of objects at once, and your aura shows infernal taint for a moment each time one comes."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/apport-object"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Blade of the Forgotten"
description = "Sheathe a blade in a ritual scabbard; for 30 minutes after you draw it, a hit and a Dark Thaumaturgy challenge make the target forget your part in the fight once you escape, for a month. The blade shows infernal taint only in your hand."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/blade-of-the-forgotten"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Call Forth the Host"
description = "Alone or with other infernalists, summon a demon you can neither command nor banish: a Stock NPC of rating 5, and more with more casters, up to 30. Once every six months; each caster's aura shows infernal taint for a year."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/call-forth-the-host"
properties = { rating = 5 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Fires of the Inferno"
description = "Burn your hand, taking 1 aggravated damage that will not heal meanwhile: for the night your Conflagration does 1 more aggravated damage, and your fire ignores immunity to fire. Your aura shows infernal taint while you cast it."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/fires-of-the-inferno"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Fool the Heart's Eye"
description = "For six days, a disguise as someone you know cannot be seen through by Heightened Senses and the like, and Entrancement gets +2 and the Appearance focus on anyone expecting them. Your aura shows infernal taint while you cast it."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/fool-the-heart-s-eye"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Fragments of the Forgotten"
description = "Burn one written source and read another by its light: whatever is plainly missing from it is whispered to you, though not always truly. Your aura shows infernal taint while the fire burns."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/fragments-of-the-forgotten"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Horrifying Spectacle"
description = "Paint hidden sigils on your skin; once that night, light them as you act with open horror, and onlookers must beat your Dark Thaumaturgy pool or spend Willpower, or stand paralysed for 5 minutes. Your aura shows infernal taint when they glow."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/horrifying-spectacle"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: House the Maeljin"
description = "Sacrifice a sinner to let one of the Maeljin possess you for the night, with a focus, a flaw and a gift of its sin. Casting it out takes Dark Thaumaturgy tests against 15, each loss costing Willpower, and your aura shows infernal taint until it is gone."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/house-the-maeljin"
properties = { rating = 5 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Knotted Chord"
description = "Knot a cord around your target's name, or a piece of them, and win a Dark Thaumaturgy challenge; untie it, and for the rest of the night any accusation they make against you names someone else. The cord shows infernal taint while it is whole."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/knotted-chord"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Learn the Heart's Pain"
description = "Cut your chest (1 normal damage) and confess a regret of your own; win a Dark Thaumaturgy challenge against someone you know to learn one of their greatest regrets. Once a month; your aura shows infernal taint while you cast it."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/learn-the-heart-s-pain"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Mutual Damnation"
description = "After 15 minutes' talk with someone, learn all their flaws and take one of them, for no XP, for this game and the next. Your aura shows infernal taint while you cast it."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/mutual-damnation"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Nightmares of the Subconscious"
description = "Breathe the smoke of a tragic death into a waking nightmare for someone you know: if they have a derangement they gain a derangement trait, or two if you guessed its type; if they have none, you take Nightmares. Your aura shows infernal taint while you cast it."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/nightmares-of-the-subconscious"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Recrimination"
description = "For the night, while you stay out of the spotlight, you can change who is shown in a picture or record you touch out of sight. Unlike other infernal powers, neither you nor the altered evidence shows infernal taint."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/recrimination"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Scribing the Unknown"
description = "Cut your palm and touch a book, drive or phone to copy out what it holds, whatever its language or ordinary encryption; magical protection takes Mental + Occult against 15. Your aura shows infernal taint while you write."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/scribing-the-unknown"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Suppression of the Outward Soul"
description = "Feed your blood to an object of innocence: until sunrise, while you carry it, you show no outward sign of your morality merit, but gain a Beast trait you cannot lose meanwhile. Your aura shows infernal taint while you cast it."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/suppression-of-the-outward-soul"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Terrorize"
description = "Take the Nightmares flaw, for no XP, for a month: meanwhile a fear power used on anyone in your sight gets its exceptional success. Your aura shows infernal taint for 10 minutes each time."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/terrorize"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Vile Swarm"
description = "Swallow a swarm of carrion insects, losing a Blood an hour while they feed; later, burst into the swarm for up to an hour, flying at double speed, taking only 1 damage from each attack and +3 to dodge. Your aura shows infernal taint only as the swarm."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/vile-swarm"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Waves of Agony"
description = "Glass under your skin (1 normal damage) lets you, while wounded, spend a simple action to give a target an incapacitated wound penalty for 5 minutes, which nothing lets them ignore. Your aura shows infernal taint for 5 minutes after each use."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/waves-of-agony"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Dark Thaumaturgy: Whispers of Chaos"
description = "Blind yourself, taking 1 unsoakable aggravated damage, to make a Lore check without the specialisation, starting from a clue you already have. Once a game; your aura shows infernal taint while you listen."
page_reference = "https://www.oneworldofdarkness.com/srd-v20/rituals/whispers-of-chaos"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Necromancy: Ancestral Ties"
description = "1 Blood, 5 minutes, decorating a bone from a corpse: it glows blue in the hand of any blood descendant of that corpse."
page_reference = "Vol. 2, p. 133"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Necromancy: Baleful Doll"
description = "1 Blood over an effigy holding a piece of the target, then broken, opposed test: they gain Fragile Bones for an hour, unless the doll is destroyed. One use a doll."
page_reference = "Vol. 2, p. 142"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Necromancy: Bastone Diabolico"
description = "1 Blood, 20 minutes, on a rune-carved human thighbone: your one permanent weapon, 1 normal damage (errata), Fast, hitting in the world or the Shadowlands; each hit drains a vampire's Blood or a wraith's Pathos. -1 to summon or control wraiths while you carry it."
page_reference = "184"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Necromancy: Bathory's Blessing"
description = "1 Blood, bathing in the blood of as many dying or fresh mortal dead as your Generation dots: flawless skin and an extra Social focus for the evening. Killing for it gives you 4 Beast traits."
page_reference = "Vol. 2, p. 139"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Necromancy: Bind Death's Sickle"
description = "2 to 6 casters on consecrated ground, 1 Blood each: until sunrise no one dies naturally within a mile per caster's Necromancy dot; at sunrise they all die at once. A deep breach of the Masquerade, and 10 Willpower among you, or you all fall into torpor."
page_reference = "Vol. 2, p. 145"
properties = { rating = 5 }

