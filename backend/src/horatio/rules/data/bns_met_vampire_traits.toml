page_reference = "203"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Illusion of Peaceful Death"
description = "1 Blood, 10 minutes, dusting a corpse with a feather soaked in a good man's blood: for a month it seems to have died naturally to mundane investigation; supernatural ones take -3."
page_reference = "205"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Imbued Offering"
description = "1 Blood, 10 minutes, over a trinket for a non-vampire kind: for 30 days it can restore 1 spent Gnosis, Glamour or the like to one of them (3 with the right Lore). Up to your Occult dots of them."
page_reference = "Vol. 2, pp. 167-168"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Incorporeal Passage"
description = "1 Blood, 15 minutes: for five minutes, while you gaze into a mirror shard, walk through walls and let Physical attacks pass through you, moving only forward and making no attacks. Ending inside something hurts, or sends you to torpor."
page_reference = "206"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Indelible Mark"
description = "1 Blood for belladonna ink and 1 more on a willing target's new tattoo, brand or piercing: for a year and a day it can't be removed, they are familiar to you, and your line-of-sight powers reach them anywhere. Up to your Occult dots of marks."
page_reference = "Vol. 2, p. 172"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Induce Bloodthirst"
description = "1 Blood after three nights on animal blood; later, within 3 turns of drinking 3 Blood from one person, a simple action sends you into a frenzy with the Strength focus and +2 to Grapple against those you fed on. Expires at night's end."
page_reference = "Vol. 2, pp. 177-178"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Innocence of the Child's Heart"
description = "1 Blood, 20 minutes, sacrificing a mortal child and dipping their toy in the heart's blood: while you carry it your aura reads pure white, for a week plus a week per Occult dot. You lose a point of Morality unless on the Path of Evil Revelations."
page_reference = "208"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Jinun's Bane (Assamite)"
description = "1 Blood and 15 minutes' chant in kalif smoke: the next time each participant frenzies, they keep choosing their targets with all frenzy bonuses, and a rage frenzy doesn't turn to fear at Incapacitated."
page_reference = "Vol. 2, p. 173"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Kiss of the Asp (Assamite)"
description = "1 Blood, 10 minutes, drinking a snake's blood and venom (toxicity 10 or more): for the night, each Taste of Death attack is also a free Blinding Attack, with no Willpower, penalty or loss of damage."
page_reference = "Vol. 2, p. 168"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Lightning Rod"
description = "1 Blood, 25 minutes, a rod of lightning-struck wood: holding it, your Weather Control: Lightning deals aggravated damage and can arc once a turn to a second target within 3 steps (another test, 1 less damage). Only you can use it; one at a time."
page_reference = "Vol. 2, p. 183"
properties = { rating = 5 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Machine Blitz"
description = "1 Blood, 10 minutes, destroying a device you have used: for an hour, 1 Blood and a standard action stop a machine you can see, anything more complex than a firearm (errata). Repair takes Computer 3, or the like, and an hour."
page_reference = "205"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Milk of Set (Setite)"
description = "1 Blood, 5 minutes: a salve that makes an object malfunction for a day, as the Storyteller decides, never in your direct favour. No effect on creatures; three batches at a time."
page_reference = "Vol. 2, p. 165"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Mirror Walk"
description = "Two silver mirrors soaked in 2 Blood over three nights: say the password before one and after three turns step through to the other, with one willing passenger. One pair at a time; 10 minutes between uses."
page_reference = "208-209"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Mirror of Second Sight"
description = "1 Blood, a silver mirror soaked in your blood over three nights: in it you alone see supernatural creatures' true forms, and ghosts."
page_reference = "207"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Mnemosyne Crystal (Tremere)"
description = "1 Blood, 10 minutes on a quartz crystal; then 1 Blood with it on the forehead as you use Forgetful Mind: the memories you take are kept in it until it's broken. Up to your Occult dots of crystals."
page_reference = "Vol. 2, p. 168"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Paper Flesh"
description = "1 Blood, 25 minutes, burning paper with the target's birth name and image, opposed test: until sunrise they lose their top 3 dots of Fortitude (2 if Stamina-focused), elder powers first. They must be present, or within 10 miles if you know their birth name."
page_reference = "211"
properties = { rating = 5 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Pavis of the Foul Presence"
description = "1 Blood, 15 minutes, a blue silk cord at your neck: the next Presence power aimed at you is resisted as usual, and if you win it turns back on its user; either way, that power can't touch you from them for an hour."
page_reference = "207"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Perfect Forgery"
description = "1 Blood, 20 minutes, coating a hand in mirror dust and silver: that night, Magic of the Smith on an object you touch makes a perfect copy, magic and all, lasting until sunrise. One copy."
page_reference = "Vol. 2, p. 178"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Plausible Deniability"
description = "Once a night, 1 Blood, 10 minutes, burning snakeskin: for 24 hours, you can make one failed Path of Corruption power undetectable to anyone, the target included."
page_reference = "Vol. 2, p. 169"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Power of the Pyramid (Tremere)"
description = "3 to 10 Tremere who know it, 1 Blood each and 20 minutes' chant: the champion gets +2 wild card on challenges using Occult for each supporter still chanting (their standard action) within sight."
page_reference = "Vol. 2, pp. 178-179"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Preservation of the Perfect Form"
description = "1 Blood, 5 minutes, frozen and dusted on an object up to a small truck: for 50 years it doesn't age or weather, though fire and force still harm it. Up to your Occult dots of objects."
page_reference = "Vol. 2, p. 165"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Principal Focus of Vitae Infusion"
description = "1 Blood, 5 minutes: turn a point of your Blood into a marble that, crushed in the mouth (a simple action), refills it; someone you teach can drink it, taking a step of blood bond to you. Up to your Occult dots of them."
page_reference = "203-204"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Proximity Ward"
description = "1 Blood, 10 minutes, a sigil traced in your blood: the first humanoid to come within a step alerts you, wherever you are; three standard actions rearm it. Up to your Occult dots of wards."
page_reference = "Vol. 2, p. 169"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Purity of Flesh"
description = "1 Blood, 10 minutes meditating in a circle of 13 candles: your body is cleansed of poisons, diseases, taints and foreign objects (like a Shaft of Belated Quiescence), and Fleshcraft. Not blood bonds or Severed Hand."
page_reference = "Vol. 2, p. 169"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Reawaken the Dead Water (Koldun)"
description = "1 Blood, 5 minutes, water strained through your ancestral soil: until sunrise you can drink the vial (a simple action) to regain 3 Willpower. One vial at a time; no use to anyone else."
page_reference = "Vol. 2, p. 165"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Recure of the Homeland"
description = "10 minutes, earth from your mortal birthplace mixed with 2 Blood: a paste that heals you 2 aggravated wounds a night, if used within a minute."
page_reference = "206"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Reverse Protocol"
description = "1 Blood, 15 minutes, swallowing molten mirror (1 unsoakable aggravated): for the evening you can score an exceptional success defending against an opposed ritual, and then, with a simple action and a contested test, turn it on its caster."
page_reference = "Vol. 2, p. 173"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Rite of Chantry Dedication (Tremere)"
description = "1 Blood, 15 minutes, swearing to defend a chantry: for a year and a day each caster gets +5 wild card to blood magic test pools within its walls. One chantry at a time."
page_reference = "Vol. 2, p. 174"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Rite of Introduction (Tremere)"
description = "1 Blood, 5 minutes, chanting your name, rank and purpose over a cauldron: the nearest chantry in the domain (or within 50 miles) knows of you and where you are, and may reply; you learn if there is none."
page_reference = "Vol. 2, p. 166"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Rite of Marduk Slain and Risen (Assamite)"
description = "1 Blood, a 30-minute rite with the would-be diablerist and three Assamite or Path of Blood players: if they diablerize the named victim within 24 hours, the victim's sire, childer and bonded share the death, and take -3 against them for 3 months."
page_reference = "Vol. 2, p. 184"
properties = { rating = 5 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Scent of Deception (Assamite)"
description = "1 Blood, 5 minutes: for an hour you can't be tracked by scent, or by Illuminate the Trail of Prey; or, for a downtime action, your scent leads trackers to a person or place you know."
page_reference = "Vol. 2, p. 166"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Scry"
description = "1 Blood, 20 minutes, a silver bowl of spring water and owl's blood, opposed Thaumaturgy test: see and hear around a person you know (or have a keepsake of) for a minute per Occult dot; a place you know needs no test. Fails on the invisible."
page_reference = "209"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Severed Hand"
description = "1 Blood and a night's work on a helpless vampire: the part you cut off can't regrow for a year and a day or until recovered, and a thaumaturge holding it gets +3 to Thaumaturgy against its owner."
page_reference = "209"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Severing Sands (Setite)"
description = "1 Blood and sun-dried sand; later a standard action and Mental + Occult against Mental + Willpower within 3 steps: banish a wraith, spirit or elemental for 24 hours, or send a projector home; others can't heal or be healed for 3 turns. Three handfuls at a time."
page_reference = "Vol. 2, pp. 184-185"
properties = { rating = 5 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Shaft of Belated Quiescence"
description = "A night's work with 3 Blood on a rowan stake: its tip breaks off in a vampire it damages and burrows toward the heart, each hour an opposed test (Thaumaturgy against Physical + Survival) for 3 normal damage, staking them at Incapacitated. One per 2 Occult dots."
page_reference = "208"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Shakari's Shroud (Assamite)"
description = "1 Blood, 20 minutes, judging and slaying a venomous animal and drinking its venom: for the night you, or another, seem to be on Humanity, not a Path."
page_reference = "Vol. 2, p. 179"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Soul of the Homunculi"
description = "1 Blood, 15 minutes, bleeding into a prepared bowl: a Homunculus, a 2-dot Retainer, gives you 2 more downtime actions a month, and rituals it helps with take the time of one level lower. One at a time."
page_reference = "207"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Stone of the True Form"
description = "1 Blood, 25 minutes, on a small stone: whoever it touches returns to their own shape and can't transform this turn or the next; throw it (Physical + Athletics against Physical + Dodge, 10 steps) or touch with a Disarm. One at a time."
page_reference = "211"
properties = { rating = 5 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Telekinetic Attunement"
description = "1 Blood, 10 minutes with a lodestone sculpture: the next Manipulate you activate lasts the whole night, with no need to activate it again for other objects."
page_reference = "Vol. 2, p. 170"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Thaumaturgic Metabolism"
description = "Medicine 1; 1 Blood, 15 minutes placing magnetic needles: for the night, each time you spend Blood on a Path of Blood power, heal 1 normal damage."
page_reference = "Vol. 2, p. 175"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Traitor's Deception"
description = "1 Blood, 15 minutes, swallowing poison berries: until sunrise your lack of faith doesn't make Sabbat ritae like the Vaulderie fail."
page_reference = "Vol. 2, p. 175"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Unerring Combustion"
description = "1 Blood, 10 minutes, burning three feathers: for the night, Flame Bolt and Engulf never miss; a lost challenge still deals 1 aggravated damage."
page_reference = "Vol. 2, p. 170"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Warding Circle"
description = "1 Blood, 5 minutes, a circle of mortal blood a step across per Occult dot: the creatures it bars (ghouls and part-supernaturals; vampires, Garou and fae at primary path 3; spirits and demons at 5) take 3 aggravated crossing it. Lasts the night, or a year and a day for a downtime action."
page_reference = "204"
properties = { rating = 1 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Way of Flame (Koldun)"
description = "1 Blood, 10 minutes, filling a room with smoke that settles as ash: for a lunar month, if anyone else disturbs it, everything in the room burns, 3 aggravated to all inside. Your ancestral soil survives."
page_reference = "Vol. 2, p. 170"
properties = { rating = 2 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Way of the Earth (Koldun)"
description = "1 Blood, 20 minutes, a paste of ancestral soil and rainwater: later, a standard action tracing it on yourself gives the Rugged merit for an hour; wounds on those levels vanish after. One at a time."
page_reference = "Vol. 2, p. 179"
properties = { rating = 4 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Way of the Supreme (Koldun)"
description = "1 Blood and a 4-hour elemental ceremony: for a lunar month, the elemental you summon with Elemental Summoning gains a bonus by kind (fire: +3 initiative and a Celerity round; earth: 2 health levels and harder blows; water: calms your frenzies; air: knockdowns)."
page_reference = "Vol. 2, p. 185"
properties = { rating = 5 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Way of the Wind (Koldun)"
description = "1 Blood, 15 minutes airing your ancestral soil, then sealed: for a lunar month, open it (a simple action) to put out a fire up to house size, ending Wall of Fire, Engulf and Firestorm, and any new fire for 5 minutes. Three bottles at a time."
page_reference = "Vol. 2, p. 175"
properties = { rating = 3 }

[[traits]]
category = "rituals"
name = "Thaumaturgy: Whispers of the Ghost"
description = "1 Blood, 5 minutes in silence, cutting the ear from a living creature (usually a Beast trait): for the night, in Psychic Projection you can whisper to someone without manifesting."
page_reference = "Vol. 2, p. 166"
properties = { rating = 1 }

[[traits]]
category = "sabbat_rituals"
name = "Acceptance"
description = "Inducts a True Sabbat into a pack, usually through a game or challenge that sets their place. Ignoblis ritus: +1 wild card to one challenge in the next three nights that fits the ritus, one Ignoblis bonus at a time."
page_reference = "436-437"
properties = { type = "Ignoblis", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Atra Sacramentum"
description = "Orthodox faction ritus, offering a piece of your own flesh (2 unpreventable aggravated damage): until next sunset, or until healed, you suffer no clan weakness. Once a lunar month."
page_reference = "438-439"
properties = { type = "Faction", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Binding"
description = "Auctoritas ritus, each Winter Solstice, renewing the Sabbat oath and hearing grievances: for a month, participants frenzy as if they had 1 fewer Beast trait among others bound with them."
page_reference = "427"
properties = { type = "Auctoritas", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Blessing of St. Blaise"
description = "Order of St. Blaise faction ritus: ends the effects of any poison, drug or other harmful substance swallowed, and guards against the next one in seven days. Not blood bonds or Disease Carrier."
page_reference = "440"
properties = { type = "Faction", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Blood Bath"
description = "Auctoritas ritus ordaining a vampire to the clergy, standing in a pool of the participants' blood; most Sabbat won't recognise an Archbishop or higher without one."
page_reference = "427"
properties = { type = "Auctoritas", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Blood Feast"
description = "Auctoritas ritus, a feast on mortals led by a Sacrosanct Cardinal, Priscus or the Regent: Blood drunk there counts double toward your Blood pool (not per-turn spending) for three nights, or until spent."
page_reference = "428"
properties = { type = "Auctoritas", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Contrition"
description = "Auctoritas ritus of atonement: the penitent, with one second, has three nights to finish a task set by their Priest and the aggrieved; success clears all negative status for it, failure strips all status for three months or six games."
page_reference = "428-429"
properties = { type = "Auctoritas", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Creation Rite"
description = "Auctoritas ritus initiating a proven fledgling as True Sabbat: a consecrated brand to the forehead as they swear the Sabbat oath. Every pack Priest learns it."
page_reference = "429"
properties = { type = "Auctoritas", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Danse Macabre"
description = "Farewell to destroyed packmates, or a departing nomadic pack, with offerings from each guest. Ignoblis ritus: +1 wild card to one challenge in the next three nights that fits the ritus, one Ignoblis bonus at a time."
page_reference = "436-437"
properties = { type = "Ignoblis", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Fire Dance"
description = "Auctoritas ritus, leaping again and again through a bonfire: for three nights, participants test fear frenzy as if they had 1 fewer Beast trait; those who refuse gain the Cowardly negative status."
page_reference = "429"
properties = { type = "Auctoritas", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Games of Instinct"
description = "Auctoritas ritus of dangerous games: whoever completes one gains a Physical attribute focus for three nights, then no focus from ritae for two games or a month, whichever is longer."
page_reference = "429"
properties = { type = "Auctoritas", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "High Holidays"
description = "Auctoritas ritus at a High Holiday (Palla Grande, Festivo Dello Estinto and the older ones): participants gain 1 Willpower over their maximum, spent first, for up to a month."
page_reference = "429-430"
properties = { type = "Auctoritas", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Irad's Wall"
description = "Ultra Conservative faction ritus: consecrate a room up to 100 square feet with incense and salt; until sunrise no spirit, wraith or projected mind can enter, and a body carried in pulls its spirit back."
page_reference = "438"
properties = { type = "Faction", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Monomacy"
description = "Auctoritas ritus of the formal duel that settles disputes, by default one on one in a 30-foot circle at the new moon: each duellist gets one extra retest to avoid losing it, and the victor chooses death, exile or loss of position."
page_reference = "430-432"
properties = { type = "Auctoritas", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Running the Gauntlet"
description = "Physical games and open combat between participants, for the sect to watch and learn. Ignoblis ritus: +1 wild card to one challenge in the next three nights that fits the ritus, one Ignoblis bonus at a time."
page_reference = "436-437"
properties = { type = "Ignoblis", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Sacrificial Rites"
description = "Capture a human, werewolf or vampire alive, then sacrifice it as bloodily as possible as a warning. Ignoblis ritus: +1 wild card to one challenge in the next three nights that fits the ritus, one Ignoblis bonus at a time."
page_reference = "436-437"
properties = { type = "Ignoblis", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Sermons of Caine"
description = "Auctoritas ritus of theological teaching or debate: those who take part gain a Mental attribute focus for three nights, then no focus from ritae for two games or a month, whichever is longer."
page_reference = "432-433"
properties = { type = "Auctoritas", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Stealth"
description = "Vows and tests of silence and moving unseen, such as crossing Camarilla ground unnoticed. Ignoblis ritus: +1 wild card to one challenge in the next three nights that fits the ritus, one Ignoblis bonus at a time."
page_reference = "436-437"
properties = { type = "Ignoblis", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Sun Dance"
description = "Chanting, dancing and counting coup from sunset to sunrise, with no wounds healed. Ignoblis ritus: +1 wild card to one challenge in the next three nights that fits the ritus, one Ignoblis bonus at a time."
page_reference = "436-437"
properties = { type = "Ignoblis", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Tower of Babel"
description = "Loyalist faction ritus for up to 10: until sunrise they can talk to one another, by any sense or even by phone, in a tongue no one else can decipher by any means."
page_reference = "439"
properties = { type = "Faction", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Vaulderie"
description = "Auctoritas ritus of shared, purified blood from a chalice among willing believers: it frees them of blood bonds and gives each pair a vinculum, from 1 (kinship) to 5 (devotion) as they repeat it."
page_reference = "433-435"
properties = { type = "Auctoritas", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Vision Quest"
description = "A week's starvation, meditation and a pageant of Caine's stories, seeking a vision or a pack's leadership. Ignoblis ritus: +1 wild card to one challenge in the next three nights that fits the ritus, one Ignoblis bonus at a time."
page_reference = "436-437"
properties = { type = "Ignoblis", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "War Party"
description = "Auctoritas ritus on up to 15 vampires hunting a named enemy who isn't True Sabbat, until sunrise: each can take up to 5 Beast traits for +1 wild card each against the target; the killer gains Triumphant."
page_reference = "435"
properties = { type = "Auctoritas", sect = "Sabbat" }

[[traits]]
category = "sabbat_rituals"
name = "Wild Hunt"
description = "Auctoritas ritus by an Archbishop or higher (Sacrosanct or Glorious) against a Sabbat traitor who doesn't answer the charges in three nights: they bear a bleeding mark, lose all status and position, and their vinculums to others break."
page_reference = "435-436"
properties = { type = "Auctoritas", sect = "Sabbat" }

