[[traits]]
category = "merits"
name = "Thaumaturgic Expertise"
description = "Learn another Thaumaturgy path without a teacher at in-clan cost, though it is not in-clan. May be bought more than once."
page_reference = "243"
properties = { rating = 1, type = "Clan", requirement = "Tremere" }

[[traits]]
category = "merits"
name = "Dark Magics"
description = "A demonic pact teaches one path of Thaumaturgy, bought at out-of-clan costs; using it briefly taints your aura."
page_reference = "Vol. 2, p. 259"
properties = { rating = 3, type = "Clan", requirement = "Baali" }

[[traits]]
category = "merits"
name = "Favored of the Decani"
description = "Once per game session, automatically succeed at a Daimoinon challenge, or turn a win into an exceptional success; your aura is stained for an hour."
page_reference = "Vol. 2, p. 260"
properties = { rating = 1, type = "Clan", requirement = "Baali: Angelis Ater", uses_per_game = 1 }

[[traits]]
category = "merits"
name = "Song of the Fifth Trumpet"
description = "Mortals who see your Daimoinon powers are terrified into silence. You sense those who have made, or would make, infernal pacts."
page_reference = "Vol. 2, p. 260"
properties = { rating = 2, type = "Clan", requirement = "Baali: Angelis Ater" }

[[traits]]
category = "merits"
name = "Shadows of the Past"
description = "Descended from the first Black Angels: in-clan disciplines are Daimoinon, Obtenebration and Dominate, plus up to 3 points of Lasombra merits free. Creation only."
page_reference = "Vol. 2, p. 260"
properties = { rating = 3, type = "Clan", requirement = "Baali: Angelis Ater" }

[[traits]]
category = "merits"
name = "Blight of the Ever-Hungry"
description = "In-clan disciplines become Auspex, Potence and Necromancy: Path of the Graveborne; a serrated maw bites without a grapple. Creation only."
page_reference = "Vol. 2, p. 62"
properties = { rating = 3, type = "Clan", requirement = "Nagaraja" }

[[traits]]
category = "flaws"
name = "Followers of Set: Temperament of Storms"
description = "Unless a storm is brewing or it is nearly dark, your difficulty to resist frenzy is increased by 2."
page_reference = "Vol. 2, p. 271"
properties = { rating = 2, type = "Clan", requirement = "Followers of Set" }

[[traits]]
category = "flaws"
name = "Baali: Devil's Mark"
description = "A visible infernal deformity. Obfuscate can hide it but Vicissitude cannot remove it."
page_reference = "Vol. 2, p. 281"
properties = { rating = 1, type = "Clan", requirement = "Baali", visible = "Devil's Mark: an infernal deformity" }

[[traits]]
category = "flaws"
name = "Baali: Carrion Comfort"
description = "You can feed only on the dead or carrion-eaters: no Herd, and an extra downtime action to feed or you start the game at half Blood."
page_reference = "Vol. 2, p. 281"
properties = { rating = 2, type = "Clan", requirement = "Baali" }

[[traits]]
category = "flaws"
name = "Baali: Infernal Thrall"
description = "Indebted to a demon master as if you had Infernal Power, with none of its benefits; disobeying costs 5 aggravated damage."
page_reference = "Vol. 2, p. 281"
properties = { rating = 3, type = "Clan", requirement = "Baali" }
