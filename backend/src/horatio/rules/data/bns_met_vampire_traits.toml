page_reference = "87"

[[traits]]
category = "archetype"
name = "Hedonist"
description = "You live for pleasure, and the next indulgence is never far from your mind."

[[traits]]
category = "archetype"
name = "Hunter"
description = "You go after what you want as a predator does its prey: patient, relentless, and at your best on the chase."

[[traits]]
