[[traits]]
category = "backgrounds"
name = "Allies"
description = "Mortals who help you because they want to, each with their own talents. Each dot is one group of allies, such as morgue workers or a street gang; call in a favour that suits them once per game for each dot."
page_reference = "98"
properties = { uses_per_game = "rating" }

[[traits]]
category = "backgrounds"
name = "Alternate Identity"
description = "A second, well-established identity, with the papers, history and acquaintances to make it convincing. Each dot makes it stand up to closer scrutiny, from a quick internet search at 1 to a powerful public figure at 5, but it never fools powers such as Telepathy, or anyone who sees it's you. Bought once for each identity."
page_reference = "98-99"
# Bought once for each cover identity, each with its own name and dots (p. 99).
properties = { instance = "identity" }

[[traits]]
category = "backgrounds"
name = "Contacts"
description = "People in a field who pass you information when you ask. Each dot is one well-connected person; once per dot each session, ask the Storyteller for one piece of information about a plot, or about one influence action in the city last month."
page_reference = "99"
properties = { uses_per_game = "rating" }

[[traits]]
category = "backgrounds"
name = "Fame"
description = "Mortals know who you are, which opens doors but makes it harder to go unnoticed: from a local scene at 1 dot to the whole country at 5. Mortals who know you give +5 to your non-supernatural Social challenges and do you favours, but word of what you ask gets around."
page_reference = "99-100"

[[traits]]
category = "backgrounds"
name = "Generation"
description = "How close your blood is to Caine's. Every vampire needs at least 1 dot, bought only at creation. Each dot sets your Blood pool and how much you spend a turn, from 10 and 1 at 11th generation to 30 and 5 at 6th, whether you can learn techniques or elder powers, and gives one bonus point to raise an attribute's maximum."
page_reference = "100-102"

[[traits]]
category = "backgrounds"
name = "Haven"
description = "A safe place to rest by day. Each dot gives it one advantage: Library, Location, Luxury, Security, Size, Staff, Occult or Guards."
page_reference = "102"

[[traits]]
category = "backgrounds"
name = "Herd"
description = "Mortals you can feed on easily, so finding blood takes less effort. You needn't spend a downtime action feeding before each game, and at one you can feed in 5 minutes rather than 15, for as much Blood as your Herd."
page_reference = "102-103"
properties = { uses_per_game = "rating" }

[[traits]]
category = "backgrounds"
name = "Influences: The Elite"
description = "Pull among society's powerful, such as politics, finance, the media and high society. Each dot is one influence action a month, with a specialisation of its own (p. 509)."
page_reference = "103"
properties = { uses_per_game = "rating" }

[[traits]]
category = "backgrounds"
name = "Influences: The Underworld"
description = "Pull among society's underside, such as crime, the street and the transient. Each dot is one influence action a month, with a specialisation of its own (p. 509)."
page_reference = "103"
properties = { uses_per_game = "rating" }

[[traits]]
category = "backgrounds"
name = "Resources"
description = "Money and property: the more dots, the more you can afford and the better you live, from $1,000 a month to spend at 1 to $250,000 at 5. Overtaxing them lets you spend twice that, but costs 2 dots for six games or three months."
page_reference = "103-104"
properties = { uses_per_game = "rating" }

[[traits]]
category = "backgrounds"
name = "Retainers"
description = "Loyal servants, often ghouls, who serve you directly. A Retainer's test pool is twice its rating, with a health level and a specialty for each dot: +5 in one skill, or (just one) a discipline in-clan for you, to its rating. Bought once for each Retainer."
page_reference = "104-105"
# Bought once for each Retainer, each with its own name and up to 5 dots (p. 104).
properties = { requirement = "requires_specialization", instance = "Retainer" }

[[traits]]
category = "backgrounds"
name = "Rituals"
description = "For initiated Sabbat only: the ritae you know and can lead for your pack, such as the Vaulderie. The first dot teaches the Creation Rites, the Vaulderie, the Monomacy and one more, and each dot after it two more. A pack Priest needs at least 1."
page_reference = "452"
properties = { sect = "Sabbat" }

[[traits]]
category = "backgrounds"
name = "Shared Haven"
description = "A haven you share with others, each of you adding to it."
page_reference = "102"
properties = { requirement = "requires_specialization" }

