[[traits]]
category = "luminary_disciplines"
name = "Animalism: Embrace the Beast"
description = "3 Blood, simple action: a rage frenzy you control, with Drawing Out the Beast's benefits; Mental and Social powers that don't hurt can't touch you, and you can't use them."
page_reference = "Vol. 2, p. 194"

[[traits]]
category = "luminary_disciplines"
name = "Animalism: Supreme Resolve"
description = "Always on: Willpower retests against you cost 1 more, and in frenzy you get a free retest each round."
page_reference = "Vol. 2, p. 194"

[[traits]]
category = "luminary_disciplines"
name = "Auspex: Collective Cognizance"
description = "Always on: no Gaze and Focus needed on anyone in sight; your failures go unnoticed, and you can make another seem to use your power."
page_reference = "Vol. 2, p. 197"

[[traits]]
category = "luminary_disciplines"
name = "Auspex: Mirror Reflexes"
description = "3 Blood, any time: for the fight, a Willpower back on each Physical retest against foes you chose."
page_reference = "Vol. 2, p. 197"

[[traits]]
category = "luminary_disciplines"
name = "Celerity: Between the Ticks"
description = "2 Blood for the turn: no attacks, but assist defender for up to your Athletics dots of allies each round, with exceptional successes."
page_reference = "Vol. 2, p. 199"

[[traits]]
category = "luminary_disciplines"
name = "Celerity: Momentum Swing"
description = "Always on with any Celerity power: throw melee attackers 6 steps, and deflect projectiles at someone else (Physical + Dodge test)."
page_reference = "Vol. 2, p. 200"

[[traits]]
category = "luminary_disciplines"
name = "Chimerstry: Passion Play"
description = "3 Blood, 3 turns: a solid illusory place until dawn, where your Chimerstry 1-4 work without a test."
page_reference = "Vol. 2, p. 203"

[[traits]]
category = "luminary_disciplines"
name = "Daimoinon: Revelry of the Great Beast"
description = "1 Blood, simple action: 15 minutes of a gluttony, fear or rage aura; anyone attacking you tests for frenzy first."
page_reference = "Vol. 2, p. 206"

[[traits]]
category = "luminary_disciplines"
name = "Dementation: Fractaline Epiphany"
description = "Always on: failing a Mental or Social challenge doesn't make the target immune to you."
page_reference = "Vol. 2, p. 209"

[[traits]]
category = "luminary_disciplines"
name = "Dementation: Wave of Insanity"
description = "+4 Blood on Total Insanity: two more targets, for 10 minutes."
page_reference = "Vol. 2, p. 209"

[[traits]]
category = "luminary_disciplines"
name = "Dominate: Empowering the Puppet King"
description = "Lend your Mesmerism, unseen, to an order someone else gives."
page_reference = "Vol. 2, p. 212"

[[traits]]
category = "luminary_disciplines"
name = "Dominate: Mob Rule"
description = "3 Blood, standard action: for an hour, willing allies following your order resist distraction and share a pool of Willpower."
page_reference = "Vol. 2, p. 212"

[[traits]]
category = "luminary_disciplines"
name = "Fortitude: Indestructible"
description = "Half your Blood, any time: undo all the damage you have taken this turn."
page_reference = "Vol. 2, p. 214"

