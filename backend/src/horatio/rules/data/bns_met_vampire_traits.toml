# The Vampire trait catalogue, generated by tools/import_yorick_catalogue.py
# from a Yorick descriptions export, and edited by hand since. Clans, with their
# in-clan disciplines, are in bns_met_vampire.toml; sect status, and what each
# title gives, in bns_met_vampire_status.toml.
#
# Every merit and flaw has a description, a line of our own words checked against
# the book, and a `page_reference`: a bare number for MET: VTM, otherwise the
# book first ("Vol. 2, p. 269", "Vol. 2 Issue 1, p. 46"). One that no book we
# have describes says why in `unsourced` instead (tests/test_catalogue_descriptions.py).
# Every technique, elder and luminary power, ritual and Sabbat ritus has one too: its
# cost, action or casting time, test and effect, and its page.
# The Dark Thaumaturgy rituals come from the V20 LARP SRD, not a book, so their
# `page_reference` is their page there, a link.
#
# A trait whose rules limit how often it can be used at a game has
# `uses_per_game`, which gives it a counter on the Play View (horatio.play): a
# number, "rating" for one use per dot, or { category, name } for one use per
# dot of another trait. Herd and the Influences count one per dot too, as the
# troupe's monthly game spends them, and so does Leadership, for learning about
# another character's status (p. 310).
#
# `tags` sort traits for checks (horatio.rules.checks, `tagged`): "vampire_only" on
# a merit or flaw about the vampiric condition, which a ghoul cannot take
# (MET: VTM p. 296; bns_met_ghoul_checks.toml).
#
# `adds_weakness` on a flaw names a clan or bloodline whose weakness it gives the
# character as well as their own (Coldly Logical, the True Brujah's: Vol. 2, p. 270;
# horatio.clan_weaknesses). `choices` lists the details a merit or flaw is taken
# with, one of which the player chooses (Golconda Seeker's benefit, pp. 249-250).

