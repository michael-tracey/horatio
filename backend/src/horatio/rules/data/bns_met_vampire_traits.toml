description = "Abyssal Mysticism, allows access to items that require it. Walk through the Abyss w/ up to 3 willing people. Test with ST to determine time to destination (no pool); win = 1hr, tie = 3 hours, loss = 6 hours. Suffer 1 agg per hour in the Abyss."
page_reference = "241"
properties = { rating = 3, type = "Clan", requirement = "Lasombra" }

[[traits]]
category = "merits"
name = "Walking Dead"
description = "Raise an intelligent zombie Retainer (rating 5, with a Fortitude or Obfuscate specialisation) that can help with downtime actions."
page_reference = "Vol. 2 Issue 1, p. 48"
properties = { rating = 2, type = "Clan", requirement = "Cappadocians: Samedi" }

[[traits]]
category = "merits"
name = "Web of Knives"
description = "Gain Potence as an extra in-clan discipline and the Path of Blood merit free, bound by a blood oath of loyalty to the Web of Knives."
page_reference = "Vol. 2 Issue 1, p. 26"
properties = { rating = 3, type = "Clan", requirement = "Assamite" }

[[traits]]
category = "merits"
name = "Whisper of Life"
description = "Register as mortal on all attempts to determine creature type, have unnaturally bright aura and animals can't sense Beast. Works only while your Morality is above 3, and cannot be on a Path of Enlightenment."
page_reference = "253"
properties = { rating = 1, type = "General" }
tags = ["vampire_only"]

[[traits]]
category = "merits"
name = "Whispers from Beyond"
description = "Once per game for each dot of Occult, the Loa take you over for a turn, raising one skill to 5 dots."
page_reference = "Vol. 2 Issue 1, p. 48"
properties = { rating = 1, type = "Clan", requirement = "Cappadocians: Samedi", uses_per_game = { category = "skills", name = "Occult" } }

[[traits]]
category = "merits"
name = "Wild One"
description = "Gain a +1 bonus to Brawl and Drive test pools and a +2 to defense test pools against formal title holders of the Camarilla and Sabbat."
page_reference = "487"
properties = { rating = 1, type = "Anarch", pools = [{ pool = "attack:Brawl", amount = 1 }, { pool = "skill:Drive", amount = 1 }, { pool = "defense", amount = 2, when = "against Camarilla and Sabbat title holders" }] }

[[traits]]
category = "merits"
name = "Zealot"
description = "When in ritae that fails, can make a static challenge (Mental+Occult vs. 6) to determine the number of participants who lacked faith."
page_reference = "453"
properties = { rating = 1, type = "Sabbat" }

