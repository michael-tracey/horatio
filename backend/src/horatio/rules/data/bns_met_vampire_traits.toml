page_reference = "87"

[[traits]]
category = "archetype"
name = "Artist"
description = "You live for inspiration, emotion and making things: your art is your reason to exist."
page_reference = "87"

[[traits]]
category = "archetype"
name = "Bully"
description = "You're stronger than others and proud of it; they'd best let you have your way."
page_reference = "87"

[[traits]]
category = "archetype"
