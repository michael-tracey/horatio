[[traits]]
category = "skills"
name = "Academics"
description = "A broad education: history, the arts, philosophy and the like. Once per night, after 10 minutes' study, you may retest one static (non-combat) challenge that fits one of your Academics fields, without spending Willpower."
page_reference = "92"
properties = { attribute = "Mental" }

[[traits]]
category = "skills"
name = "Animal Ken"
description = "Understanding animals: calming, training and reading them, and getting them to trust you. Animals no longer panic at your presence, and 10 minutes' talk calms someone else's Beast, removing one Beast trait; once per game per target, and never your own."
page_reference = "92"
properties = { attribute = "Social" }

[[traits]]
category = "skills"
name = "Athletics"
description = "Running, jumping, climbing, swimming and throwing. Swimming, climbing and jumping are simple actions for you, not standard ones, and you can use combat maneuvers with thrown weapons and bows."
page_reference = "92"
properties = { attribute = "Physical" }

[[traits]]
category = "skills"
name = "Awareness"
description = "Keen senses and a feel for when something unnatural is at work around you. You have a chance to notice supernatural powers used nearby (p. 281), and in torpor you can still think and use powers that affect only you."
page_reference = "92-93"
properties = { attribute = "Mental" }

[[traits]]
category = "skills"
name = "Brawl"
description = "Fighting with your body: fists, feet, grapples and claws. You can use combat maneuvers when fighting unarmed (p. 280)."
page_reference = "93"
properties = { attribute = "Physical" }

[[traits]]
category = "skills"
name = "Computer"
description = "Using, programming and breaking into computers and networks. You get 1 more downtime action between games, used as any other or to cancel or watch one downtime action of another character's."
page_reference = "93"
properties = { attribute = "Mental" }

[[traits]]
category = "skills"
name = "Crafts"
description = "Making things with skill, from fine art to mechanical repair. Taken for one field at a time, such as Carpentry or Painting. 2 downtime actions, to make something and sell it, give you +1 Resources for a month, up to 5."
page_reference = "93"
properties = { attribute = "Mental", requirement = "requires_specialization" }

[[traits]]
category = "skills"
name = "Dodge"
description = "Getting out of the way of blows, bullets and anything else thrown at you. Give up your standard action for +2 to one Dodge test pool that round; caught in an explosion or other area attack, a Dodge test (difficulty 8) takes 1 off the damage."
page_reference = "93"
properties = { attribute = "Physical" }

[[traits]]
category = "skills"
name = "Drive"
description = "Driving well under pressure: chases, stunts and dangerous conditions. The first dot covers cars, and each further dot another kind of vehicle. Driving takes you a simple action, not your full attention."
page_reference = "93-94"
properties = { attribute = "Physical" }

[[traits]]
category = "skills"
name = "Empathy"
description = "Reading moods, motives and emotions, and understanding what makes people tick. A short talk tells you whether someone has derangements, and a few minutes which. Knowing one, a standard action raises or lowers their Derangement traits by 1 (0 to 3) for an hour; not below 1 for a Malkavian, and never on yourself."
page_reference = "94"
properties = { attribute = "Social" }

[[traits]]
category = "skills"
name = "Firearms"
description = "Handling, maintaining and shooting guns accurately. You can use combat maneuvers in ranged combat (p. 280)."
page_reference = "94"
properties = { attribute = "Physical" }

[[traits]]
category = "skills"
name = "Intimidation"
description = "Frightening people into backing down or doing what you want, through threat or sheer presence. Stock NPCs of level 1 or 2, Retainers among them, won't attack you, and flee if you turn on them; mindless ones aren't put off."
page_reference = "94"
properties = { attribute = "Social" }

[[traits]]
category = "skills"
name = "Investigation"
description = "Searching scenes, following leads and piecing clues together. A standard action studying someone within three steps, or three searching a room, finds any weapons, explosives or hidden objects; something Concealable only with a pat-down or search."
page_reference = "94"
properties = { attribute = "Mental" }

[[traits]]
category = "skills"
name = "Leadership"
description = "Inspiring and directing others, and planning so a group works well together. Stock NPCs following your lead get +2 to what they do, and once per night for each dot you can learn the details of one of another vampire's status traits."
page_reference = "94"
properties = { attribute = "Social" }

[[traits]]
category = "skills"
name = "Linguistics"
description = "Languages beyond your native tongue: each dot is another language you speak fluently."
page_reference = "94"
properties = { attribute = "Mental" }

[[traits]]
category = "skills"
name = "Lore"
description = "Hidden knowledge of the supernatural world, such as Kindred or a clan. Each dot gives a specialisation in one subject; when you need to know something in it, a static Mental + Lore challenge gives you detailed insight. Fail, and you can't try again until you learn something new."
page_reference = "94-96"
properties = { attribute = "Mental" }

[[traits]]
category = "skills"
name = "Medicine"
description = "Anatomy, first aid, diagnosis and treatment, and knowledge of drugs. A downtime action in a proper medical facility, studying blood, hair, skin or remains, tells you what kind of creature they came from; if you know vampires, its clan and generation too. With the right equipment you can keep blood fresh for a month per dot."
page_reference = "96"
properties = { attribute = "Mental" }

[[traits]]
category = "skills"
name = "Melee"
description = "Fighting with hand-held weapons, from knives to swords and clubs. You can use combat maneuvers with melee weapons (p. 280)."
page_reference = "96"
properties = { attribute = "Physical" }

[[traits]]
category = "skills"
name = "Occult"
description = "Knowledge of magic, myth and the mystical, true and false alike. A standard action studying someone within three steps shows any active rituals on them or magic items they carry, but not what they do. You can also buy the Occult advantage for your own Haven."
page_reference = "96"
properties = { attribute = "Mental" }

[[traits]]
category = "skills"
name = "Performance"
description = "Entertaining an audience with talent and technique. Taken for one field at a time, such as Singing or Acting. 2 downtime actions, to promote a performance and give it, give you +1 Fame for a month, up to 5."
page_reference = "96"
properties = { attribute = "Social", requirement = "requires_specialization" }

[[traits]]
category = "skills"
name = "Science"
description = "Formal study of a scientific field. Taken for one field at a time, such as Chemistry or Physics. Each Science gives you 1 more downtime action, spent only on something its field covers."
page_reference = "96-97"
properties = { attribute = "Mental", requirement = "requires_specialization" }

[[traits]]
category = "skills"
name = "Security"
description = "Locks, alarms and surveillance: getting past them, or setting them up. Picking a lock or palming something small takes you a simple action, not a standard one. Your Haven has the Security advantage free, and a downtime action gives it to someone else's for a year."
page_reference = "97"
properties = { attribute = "Physical" }

[[traits]]
category = "skills"
name = "Stealth"
description = "Moving unseen and unheard, and hiding when others look for you. With a few suitable props you pass as a kind of person, such as a police officer or a clubber, though not to anyone who already knows it's you."
page_reference = "97"
properties = { attribute = "Physical" }

[[traits]]
category = "skills"
name = "Streetwise"
description = "Knowing the streets: their people, rules, slang and where to get things. While your way leads through a busy urban area, no one can follow you without a power made for tracking."
page_reference = "97"
properties = { attribute = "Social" }

[[traits]]
category = "skills"
name = "Subterfuge"
description = "Lying, bluffing and misdirection, and spotting when someone does it to you. Once per game, caught using a supernatural power, you can make it seem that someone of your choosing within three steps used it; not for one with an obvious source, such as Flame Bolt."
page_reference = "97"
properties = { attribute = "Social", uses_per_game = 1 }

[[traits]]
category = "skills"
name = "Survival"
description = "Finding your way and staying alive in the wild: tracking, shelter and navigation. Once per hour in a rage or hunger frenzy, you may turn it into a fear frenzy and run, rather than harm those around you."
page_reference = "97"
properties = { attribute = "Physical" }

