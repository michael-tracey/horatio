# Sect status, written by hand (horatio.rules.status): every status trait with its
# sect and what it does, each sect's name for Accepted and its status bans, the
# status each title and social age gives, and the status caps.
#
# From MET: Vampire The Masquerade (2013): Chapter Seven, pp. 310-317, for the
# general status; Chapter Nine (the Camarilla), Ten (the Sabbat) and Eleven (the
# Anarch Movement) for each sect's own. Page numbers are the book's printed ones.
# The effects are one-line summaries in our own words: the book has the full text.
#
# The Independent Alliance's status and titles have no rulebook source yet: each has
# its sect (from Yorick's catalogue), is marked `no_rules_yet`, and gives nothing.

# What a character carries into a game (p. 313): the status of one abiding source,
# all innate and negative status, and up to 5 fleeting, or fewer under a status
# ban: 3 under a lesser ban, 1 under a greater (abiding status is unaffected).
[status_caps]
abiding_sources = 1
fleeting = 5
lesser_ban = 3
greater_ban = 1
page = "313"

# Merits and flaws that change the fleeting cap: `fleeting` more, or fewer, on top
# of any ban (each flaw says its penalty adds to a ban's).
[[cap_changes]]
category = "merits"
name = "Reputation"
fleeting = 1
page = "252"

[[cap_changes]]
category = "flaws"
name = "Tainted Embrace"
fleeting = -1
page = "405"

[[cap_changes]]
category = "flaws"
name = "Mistrusted"
fleeting = -1
page = "454"

[[cap_changes]]
category = "flaws"
name = "Dubious Loyalties"
fleeting = -1
page = "487"

# A character no sect has Accepted holds no status, but for this: an Emissary to the
# Camarilla can hold one fleeting Camarilla status while it is Accepted by no sect
# (p. 404). A sect with no status rules here (the Independent Alliance) counts as none.
[[outsiders]]
category = "merits"
name = "Emissary to the Camarilla"
sect = "Camarilla"
fleeting = 1
page = "404"

# --- sects: Accepted and status bans ---------------------------------------------------------
