# --- social age ------------------------------------------------------------------------------
#
# In the Camarilla, social age is a source of abiding status like a title (p. 400).
# Ancilla and Elder are social ages, worked out from the sheet, not titles. The
# Sabbat and the Anarchs have none: Sabbat status ignores generation and age
# (p. 446), and the Anarchs reject status by social class (p. 481).

[[social_ages]]
sect = "Camarilla"
age = "Ancilla"
status = ["Confirmed"]
page = "400"

[[social_ages]]
sect = "Camarilla"
age = "Elder"
status = ["Confirmed", "Established", "Privileged"]
page = "400"

# --- titles ----------------------------------------------------------------------------------
#
# The abiding status each title gives during its holder's tenure. Titles in the
# catalogue's list that are not here have no sect and give no status. A sect's
# title that gives none says why in `gives_none`, with its page; one of the
# Independent Alliance has `no_rules_yet` (horatio.rules.status). `aliases` are
# other names for the same office, which give the same.
#
# They are listed highest first within each sect, as the Who's Who ranks its court
# (horatio.whos_who): the Camarilla's from the Inner Circle down to the Scourge
# (pp. 371-380), then the Sabbat's (pp. 416-421) and the Anarchs' (pp. 473-474).
#
# A title marked `unique` is one a domain has only one of at a time (a Prince, a
# Sheriff, a Baron): no player can choose it while another character holds it. The
# rest may be held by several (a Primogen of each clan, Archons, a pack's Ductus).
#
# A Lesser Harpy, who gains Guardian while the Master Harpy is away (p. 379), is
# not in the list.

