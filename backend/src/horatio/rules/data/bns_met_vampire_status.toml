# --- general status (pp. 313-317) ------------------------------------------------------------
#
# Status is used on characters in the user's jurisdiction: within the last 30 days in
# her domain, salon or martial action (p. 314).

[[traits]]
category = "status_traits"
name = "Authority"
page_reference = "314"
[traits.properties]
type = "Abiding"
sect = "General"
passive = "Give Courageous, Defender, Honorable or Loyal without spending it; each person holds one at a time from you."
spent = "Punish or pardon: give or remove Warned or Forsaken."
source = "A ruler's title: Prince, Archbishop, Baron and the sect's highest offices."

[[traits]]
category = "status_traits"
name = "Commander"
page_reference = "314"
[traits.properties]
type = "Abiding"
sect = "General"
passive = "Give orders to any sect member without Authority; whoever defies you loses their fleeting status, unspent, for 2 games or a month, and gains none meanwhile. Deputise up to three as Enforcer for a night."
spent = "Give up to three characters Courageous or Loyal each."
source = "The sect's commanders: Justicar, Archon, Alastor, Prince, Regent."

[[traits]]
category = "status_traits"
name = "Enforcer"
page_reference = "314"
[traits.properties]
type = "Abiding"
sect = "General"
passive = "Go armed to any gathering, even where weapons are barred. Deputise up to two sect members as Defender for a night."
spent = "Give Warned to someone you believe broke the law of your sect or domain."
source = "Sheriff, Scourge, Keeper of Elysium, Templar, Constable, Architect; a Bishop's choice; deputised by a Commander or Sovereign."

[[traits]]
category = "status_traits"
name = "Established"
page_reference = "314"
[traits.properties]
type = "Abiding"
sect = "General"
passive = "Whoever openly insults, threatens or attacks you gains Warned, unless they hold Authority, Commander or Triumphant."
spent = "Give Favored."
source = "Camarilla elders; an Anarch Ambassador."

[[traits]]
category = "status_traits"
name = "Prominent"
page_reference = "314"
[traits.properties]
type = "Abiding"
sect = "General"
passive = "Give Honorable or Courteous without spending it; each person holds one at a time from you."
spent = "Send someone out of a scene for 10 minutes, or they gain Disgraced. Not in combat."
source = "Harpy, Priscus."

[[traits]]
category = "status_traits"
