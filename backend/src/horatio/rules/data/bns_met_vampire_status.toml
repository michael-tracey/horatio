type = "Innate"
sect = "Camarilla"
passive = "Attend and witness any Judicial Conclave (speaking only by leave), and approach and petition any Justicar or the hosting Prince at a conclave."
spent = "Put an item on a conclave's agenda, without your name if you like."
source = "The Architect of the Tower merit (p. 404)."

[[traits]]
category = "status_traits"
name = "Primus Inter Pares"
page_reference = "402"
[traits.properties]
type = "Innate"
sect = "Camarilla"
passive = "Your Authority outranks others': what cannot target Ascendant cannot target you, and their Authority cannot undo your uses of status."
spent = "Spend another's Authority, Established or Privileged without effect, or undo a use of them in your domain."
source = "The Prince hosting a conclave, while it lasts."

[[traits]]
category = "status_traits"
name = "Acclaimed"
page_reference = "402"
[traits.properties]
type = "Fleeting"
sect = "Camarilla"
passive = "Once a night, lend the passive effect of an unspent status you hold to one person within 10 feet, for an hour."
spent = "Have an officer of the sect give her views or advice on a matter of the domain, publicly or privately."
source = "Given with Noble; publicly protecting the Masquerade or upholding the Traditions."

[[traits]]
category = "status_traits"
name = "Gallant"
page_reference = "402"
[traits.properties]
type = "Fleeting"
sect = "Camarilla"
passive = "None."
spent = "Undo a political or etiquette error of the last five minutes: the offended must accept your apology."
source = "Repaying a great boon to someone of standing; the Social Nobility merit (p. 405)."

[[traits]]
category = "status_traits"
name = "Sanctioned"
page_reference = "402"
[traits.properties]
type = "Fleeting"
sect = "Camarilla"
passive = "None."
spent = "Break the one sect law it was given for, without punishment."
source = "Given with Sovereign."

[[traits]]
category = "status_traits"
name = "Vulgar"
page_reference = "403"
[traits.properties]
type = "Negative"
sect = "Camarilla"
censure = "Your fleeting status is spent without effect, coming back at the end of the game, and you gain no more meanwhile."
punishment = "A second Vulgar becomes Warned."
source = "Spent Noble or Privileged."
[traits.properties.duration]
this_game = true
text = "Only the game it is given at."

# --- Sabbat (pp. 446-449) --------------------------------------------------------------------

[[traits]]
category = "status_traits"
name = "Initiated"
page_reference = "446"
[traits.properties]
type = "Accepted"
sect = "Sabbat"
passive = "A full member, True Sabbat: you take part in the Auctoritas, Ignoblis and Faction Ritae, under the protection of the Code of Milan."
source = "A year and a day as False Sabbat, then the Creation Rites (pp. 427, 429)."

[[traits]]
category = "status_traits"
name = "Blessed"
page_reference = "446"
[traits.properties]
type = "Abiding"
sect = "Sabbat"
passive = "Give Battle-scarred or Loyal without spending it; each person holds one at a time from you."
spent = "Give Cowardly to someone behaving badly in your jurisdiction."
source = "Ductus; a Bishop's choice."

[[traits]]
category = "status_traits"
name = "Glorious"
page_reference = "446"
[traits.properties]
type = "Abiding"
sect = "Sabbat"
passive = "Give Consecrated or Devout without spending it. Give orders to any sect member without Authority or Sacrosanct; whoever defies you loses their fleeting status, unspent, for 2 games or a month, and gains none meanwhile."
spent = "Order a Rite of Contrition, or give Cowardly or Warned."
source = "Cardinal, Archbishop."

[[traits]]
category = "status_traits"
name = "Infamous"
page_reference = "447"
[traits.properties]
type = "Abiding"
sect = "Sabbat"
passive = "Whoever openly insults, threatens or attacks you gains Warned, unless they hold Sacrosanct or Triumphant. Give Favored without spending it."
spent = "Give Consecrated or Anointed, or give Ignorant."
source = "Priscus."

[[traits]]
category = "status_traits"
name = "Loyalist"
page_reference = "447"
[traits.properties]
type = "Abiding"
sect = "Sabbat"
passive = "Immune to the passive and spent effects of Glorious."
spent = "Cannot be spent."
source = "The Loyalist faction, while you hold no clergy post (p. 439)."

[[traits]]
category = "status_traits"
name = "Ordained"
page_reference = "447"
[traits.properties]
type = "Abiding"
sect = "Sabbat"
passive = "Perform the Ignoblis Ritae, and give Devout, without spending it; each person holds one Devout at a time from you."
spent = "Lead any Auctoritas Ritae but the Blood Bath, Blood Feast and Wild Hunt; give Anointed or Battle-scarred; give Ignorant; or order a Rite of Contrition."
source = "Archbishop, Priest; a Bishop while the Archbishop is absent."

[[traits]]
category = "status_traits"
name = "Sacrosanct"
page_reference = "447"
[traits.properties]
type = "Abiding"
sect = "Sabbat"
passive = "Immune to the powers and orders of anyone without Sacrosanct. Start any Ignoblis, and the Auctoritas Ritae but the Blood Feast and Wild Hunt, and give Favored or Resolute, without spending it."
spent = "Order a Rite of Contrition, hold the Blood Feast, call the Wild Hunt, or issue letters patent for your jurisdiction."
source = "Regent, Cardinal, Priscus."

[[traits]]
category = "status_traits"
name = "Branded"
page_reference = "447"
[traits.properties]
type = "Innate"
sect = "Sabbat"
passive = "A Sabbat who attacks you, or uses a power on you against your will, gains Warned (powers that only watch over you excepted)."
spent = "Command a Sabbat to spend a status for you, hand over equipment, or use her powers as you say, within the Code of Milan; refusing earns Disgraced."
source = "The Black Hand Membership merit (p. 452)."

[[traits]]
category = "status_traits"
name = "Purified"
page_reference = "447"
[traits.properties]
type = "Innate"
sect = "Sabbat"
passive = "Name someone a heretic (p. 426), giving them Disgraced."
spent = "Clear someone proven innocent of heresy, with an ad cautelum lasting 6 games or 3 months, whichever is longer."
source = "The Inquisition Membership merit (p. 453)."

[[traits]]
category = "status_traits"
name = "Anointed"
page_reference = "448"
[traits.properties]
type = "Fleeting"
sect = "Sabbat"
passive = "None."
spent = "Lead one named ritus your patron could, with the Rituals you already know."
source = "Given with Infamous or Ordained; innate from the Keeper of a Sacred Text merit (p. 453)."

[[traits]]
category = "status_traits"
name = "Battle-scarred"
page_reference = "448"
[traits.properties]
type = "Fleeting"
sect = "Sabbat"
passive = "The first time each night you reach Incapacitated, heal 2 health levels."
spent = "Use the assist attacker or assist defender mass combat tactic without spending its action, unless you are breaking sect law."
source = "Given with Blessed or Ordained."

[[traits]]
category = "status_traits"
name = "Consecrated"
page_reference = "448"
[traits.properties]
type = "Fleeting"
sect = "Sabbat"
passive = "Win the static challenge to wake during the day without testing (the other costs still apply, p. 293)."
spent = "Spare another character the Beast traits for an action your Path would not punish."
source = "Given with Glorious or Infamous."

[[traits]]
category = "status_traits"
name = "Devout"
page_reference = "448"
[traits.properties]
type = "Fleeting"
sect = "Sabbat"
passive = "Once a game for each Devout, spend a Blood and five minutes in prayer or study to heal 1 aggravated damage."
spent = "Give yourself or another vampire a retest on a ritus about to fail; several can go on one ritus."
source = "Given with Glorious or Ordained."

[[traits]]
category = "status_traits"
name = "Resolute"
page_reference = "448"
[traits.properties]
type = "Fleeting"
sect = "Sabbat"
passive = "+3 wild card bonus to resist fear frenzy."
spent = "A free Willpower retest against an effect that would force you out of combat; one against each opponent in a combat."
source = "Given with Sacrosanct."

[[traits]]
category = "status_traits"
name = "Scholar"
page_reference = "448"
[traits.properties]
type = "Fleeting"
sect = "Sabbat"
passive = "One fewer Beast trait for each violation of your Path, to a minimum of 0."
spent = "Cannot be spent."
source = "Your Priest, spending Ordained, when someone you taught converts to your Path."
[traits.properties.duration]
games = 4
months = 2
text = "4 games or 2 months, whichever is longer."

[[traits]]
category = "status_traits"
name = "Cowardly"
page_reference = "448"
[traits.properties]
type = "Negative"
sect = "Sabbat"
censure = "None of its own: its punishment applies while you hold it. Whoever hurts you (short of death), or beats you in a symbel or Monomacy, gains Praised."
punishment = "Your Willpower is 1 lower until Cowardly goes."
source = "Spent Blessed or Glorious."
[traits.properties.duration]
games = 4
months = 2
text = "4 games or 2 months, whichever is longer."

[[traits]]
category = "status_traits"
name = "Ignorant"
page_reference = "449"
[traits.properties]
type = "Negative"
sect = "Sabbat"
censure = "Don't preach at a Sermon of Caine, proselytise, or quote the Book of Nod in public; listen to every sermon, and don't contradict anyone quoting doctrine."
punishment = "Rituals cannot help you, though their harm still can."
source = "Spent Infamous or Ordained; a ritual failing because of you."
[traits.properties.duration]
text = "The book gives none: until someone removes it."

# --- Anarch (pp. 481-483) --------------------------------------------------------------------

[[traits]]
category = "status_traits"
name = "Committed"
page_reference = "481"
[traits.properties]
type = "Accepted"
sect = "Anarch"
passive = "Hazed in, a full member of the Movement: use your status on any Committed Anarch you have been with in the last 30 days."
source = "Proving your loyalty in combat beside the sect (p. 310); a Baron can offer it (p. 473)."

[[traits]]
category = "status_traits"
name = "Mandate"
page_reference = "481"
[traits.properties]
type = "Abiding"
sect = "Anarch"
passive = "Exile an Anarch from your territory, or a place in it; if they enter, they gain Loser."
spent = "Give Connected or Preacher; give or remove Loser, Marked or Warned; give Cherry; or call a Call to Arms against someone."
source = "Baron."

[[traits]]
category = "status_traits"
name = "Moniker"
page_reference = "482"
[traits.properties]
type = "Abiding"
sect = "Anarch"
passive = "+1 to defence pools against Intimidation and Leadership (and powers using them), and +1 more for each other holder of your gang's Moniker within 10 steps, up to +5."
spent = "Cannot be spent."
source = "The Moniker merit (p. 486)."

[[traits]]
category = "status_traits"
name = "Warrant"
page_reference = "482"
[traits.properties]
type = "Abiding"
sect = "Anarch"
passive = "Give orders in combat to any Anarch in your territory, the Baron included; whoever disobeys gains Loser."
spent = "Give Thug or Veteran; give Cherry; or order an Anarch's punishment under your territory's law (refusing earns Disgraced and Loser)."
source = "Constable."

[[traits]]
category = "status_traits"
name = "Connected"
page_reference = "482"
[traits.properties]
type = "Fleeting"
sect = "Anarch"
passive = "Once a game, call on Allies, Contacts, Herd or Resources without spending the background."
spent = "+2 levels to an influence you have, for one use."
source = "Given with Mandate; popular acclaim (p. 481)."

[[traits]]
category = "status_traits"
name = "Hardcore"
page_reference = "482"
[traits.properties]
type = "Fleeting"
sect = "Anarch"
passive = "+1 to your pool when comparing for an exceptional success (only once, however many you hold)."
spent = "A combat maneuver without spending Willpower (not with one bought with Willpower on the same action)."
source = "Popular acclaim, for risking Final Death on a vital mission or for another Anarch (p. 481)."

[[traits]]
category = "status_traits"
name = "Preacher"
page_reference = "482"
[traits.properties]
type = "Fleeting"
sect = "Anarch"
passive = "Your words cannot break the Masquerade to an ordinary mortal who overhears them."
spent = "Inspiring someone about the cause, they resist active emotion powers and blood bonds for five minutes."
source = "Given with Mandate; popular acclaim (p. 481)."

[[traits]]
category = "status_traits"
name = "Thug"
page_reference = "482"
[traits.properties]
type = "Fleeting"
sect = "Anarch"
passive = "Your Intimidation works on Stock NPCs rated up to 3, not 2."
spent = "Sneak a one-handed weapon past any detection, even supernatural."
source = "Given with Warrant; popular acclaim (p. 481)."

[[traits]]
category = "status_traits"
name = "Veteran"
page_reference = "483"
[traits.properties]
type = "Fleeting"
sect = "Anarch"
passive = "Stock NPCs following you gain an extra simple action a turn (from one Veteran a turn)."
spent = "One extra downtime action between games."
source = "Given with Warrant; popular acclaim, for fighting well in a major conflict for the Movement (p. 481)."

[[traits]]
category = "status_traits"
name = "Cherry"
page_reference = "483"
[traits.properties]
type = "Negative"
sect = "Anarch"
censure = "The bottom rung: don't speak at gang or territory meetings unless spoken to, and get no vote. You also suffer the lesser status ban."
punishment = "Gain Warned, and Cherry's 6 games or 3 months start again."
source = "Spent Mandate or Warrant."
[traits.properties.duration]
games = 6
months = 3
text = "6 games or 3 months, whichever is longer; other status cannot remove it."

[[traits]]
category = "status_traits"
name = "Loser"
page_reference = "483"
[traits.properties]
type = "Negative"
sect = "Anarch"
censure = "Barely a member: you suffer the greater status ban, and always wear a visible sign of failure chosen by whoever gave you Loser."
punishment = "-3 to defence pools against any Committed Anarch for the rest of the night, and gain Disgraced."
source = "Spent Mandate; defying a Mandate's exile or a Warrant's orders in combat."
[traits.properties.duration]
games = 2
months = 1
text = "2 games or 1 month, whichever is longer."

[[traits]]
category = "status_traits"
name = "Marked"
page_reference = "483"
[traits.properties]
type = "Negative"
sect = "Anarch"
censure = "Unwelcome in Anarch lands: harassed, taunted, even attacked, and whoever publicly insults you gains Praised, once a game each. It can be given to someone Committed in the last year and a day."
punishment = "In Anarch territory, no backgrounds or influences; your haven there is found within two nights, and Retainers you bring are destroyed once they leave your side."
source = "Spent Mandate."
[traits.properties.duration]
text = "Until the Anarchs of the territory where it was given vote unanimously to lift it."

