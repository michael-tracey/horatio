# What a Vampire sheet may hold, beyond what it costs (horatio.rules.checks).
# Page numbers are MET: Vampire The Masquerade (core). Merits and flaws whose
# catalogue requirement names a clan, bloodline or generation get their check
# automatically; these are the rest.

# --- barred by clan or bloodline --------------------------------------------

[[checks]]
category = "merits"
name = "Calm Heart"
forbids = { clan = ["Brujah"] }
message = "Brujah cannot take Calm Heart (True Brujah can)."
page = "249"

[[checks]]
category = "merits"
name = "Brotherhood"
forbids = { clan = ["Brujah: True Brujah"] }
message = "True Brujah cannot take Brotherhood."
page = "239"

[[checks]]
category = "merits"
name = "Unbondable"
forbids = { clan_family = ["Tremere"] }
message = "Tremere, including their bloodlines, cannot take Unbondable."
page = "253"

