name = "Magic Resistance"
forbids = { any_of = [
  { has = { category = "flaws", name = "Magic Susceptibility" } },
  { has_any = [
    { category = "merits", name = "Thaumaturgic Training" },
    { category = "merits", name = "Necromantic Training" },
  ] },
  { count = { category = "disciplines", name_prefix = "Thaumaturgy", gte = 1 } },
  { count = { category = "disciplines", name_prefix = "Necromancy", gte = 1 } },
] }
message = "Magic Resistance cannot be held with blood magic or Magic Susceptibility."
page = "252"

[[checks]]
