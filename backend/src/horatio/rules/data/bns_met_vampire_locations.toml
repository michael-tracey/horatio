# Stock Locations (issue #325): the places that matter in a chronicle, kept by a
# troupe's staff (horatio.locations). From MET: VTM Vol. II Issue 1 (Update 2),
# pp. 117-133, in our own words; the Haven advantages are the core book's, p. 102.
# Read by horatio.rules.locations, which checks this file's shape.
#
# [[types]]: a location's type, with the most qualities it takes per point of
#   rating (`per_rating`), and whether it takes iconic qualities. A haven is a
#   character's Haven background placed on the list: advantages, not qualities.
#
# [[options]]: the house options, each a troupe's change to the book that is on
#   unless the troupe switches it off. `text` says what it changes.
#
# [[qualities]]: what a location can have, by `kind`: standard, iconic (only on
#   an iconic location), supernatural (one per location) or elysium (only on an
#   Elysium, which earns them with time). Each has its `page` and `text`, and:
#   - `option`: the house option it belongs to; it is in the catalogue only while
#     that option is on. `replaces` names the book's quality it stands in for;
#   - `detail`: what an instance can name, such as Laboratory's specialisation;
#   - `repeatable`: a location can have it more than once (with another detail);
#   - `counts = false`: it does not count toward the location's qualities;
#   - `excludes`: qualities it cannot be held with;
#   - `haven_free`: the skill that gives it free on its holder's Haven;
#   - `suggested`: what a quest to add it should ask for (#326), each one of
#       { trait, levels?, detail?, expend?, alternative? }   a trait at a level
#       { traits = [...], ... }                             any one of these
#       { power = "Discipline: Power" }                     a power
#       { text }                                            anything else
#     `levels` go by the location's rating, lowest first, as the troupe's sheet
#     writes them ("Crafts [2,3,4]"); `expend` spends the trait rather than tests
#     it; `detail` is the specialisation or area it wants; `alternative` is what
#     can stand in for it.
#
# [[limits]]: a house option's limit on one quality: `min_rating`, the lowest
#   rating that can take it; or `per_qualities`, one more of it for each that
#   many qualities the location can have (it is then repeatable).
#
# [[negatives]]: negative qualities, each up to `most` times (`raised_by` a
#   quality that lets it take one more), with what each level does (`levels`),
#   and how it is removed. Any can be kept secret from the controller (p. 127);
#   `names_who` asks who is behind it.
#
# [[haven_advantages]]: the Haven background's advantages, one per dot.
# `needs` is a skill a character must have to take it.

types_page = "118-119, 121"
control_page = "119"
joint_page = "121"
haven_page = "117"
elysium_page = "131"

[[types]]
key = "standard"
name = "Standard"
per_rating = 1
quest = "Simple"
text = "A run-of-the-mill place that serves a purpose: a warehouse, an office, a shop. Anyone can control one."

[[types]]
key = "prestige"
name = "Prestige"
per_rating = 2
quest = "Complex"
text = "A local landmark, notable for its architecture, history or culture. Only controlled within the character's own city."

[[types]]
key = "iconic"
name = "Iconic"
per_rating = 2
iconic = true
quest = "Heroic"
text = "A place known well beyond the city, perhaps the world. Staff decide whether a character can control it at all, and control is always conditional."

[[types]]
key = "haven"
name = "Haven"
per_rating = 0
text = "A character's Haven background, placed on the list. It can't be targeted as a Stock Location can, and it doesn't count toward the control limit (p. 117)."

# --- house options ------------------------------------------------------------

[[options]]
key = "conglomerates"
name = "Conglomerates"
text = "A location can be the parent of others, as a mall's management office is of its shops. The parent lists its subsidiaries and who controls each. Controlling it lets a quest for a subsidiary ignore one requirement, and a character who controls every subsidiary has the parent free, outside the control limit. Adds the Conglomerate quality."

[[options]]
key = "two_libraries"
name = "Two libraries"
text = "Library [Repository] (Lore) and Library [Mundane] (Academics and Linguistics) in place of the book's one Library."

[[options]]
key = "house_qualities"
name = "The troupe's added qualities"
text = "Adds Clubhouse, Derelict, Medical Facility, Tranquil and Travel Center to the catalogue."

[[options]]
key = "quality_limits"
name = "Limits on qualities"
text = "Fancy and Lowdown and Dirty only on a location rated 4 or higher. Profitable can be taken more than once, one for each 3 qualities the location can have, each giving Resources at that many dots."

[[options]]
key = "two_laboratories"
name = "Laboratory with two specialisations"
text = "A Laboratory covers two Science specialisations, or Animal Ken, rather than one."

[[limits]]
option = "quality_limits"
quality = "Fancy"
min_rating = 4

[[limits]]
option = "quality_limits"
quality = "Lowdown and Dirty"
min_rating = 4

[[limits]]
option = "quality_limits"
quality = "Profitable"
per_qualities = 3

