note = "Talk with animals, or question all the local wildlife within earshot. The Storyteller answers as the animals would."
focus = { Charisma = "Speak mind to mind with animals that can see you; no growling needed." }

[[powers]]
discipline = "Animalism"
level = 2
name = "Beckoning"
note = "1 Blood, standard action: call up to five small, three medium or one large animal, arriving over about 10 minutes."
focus = { Charisma = "Give the summoned animals one extra trait, such as flight or cunning." }

[[powers]]
discipline = "Animalism"
level = 3
name = "Quell the Beast"
note = "1 Blood, standard action, Animalism test against someone focused on you: ends their frenzy, or stops them frenzying for an hour."
focus = { Manipulation = "The victim cannot retest with Willpower at all while it lasts." }

[[powers]]
discipline = "Animalism"
level = 4
name = "Subsume the Spirit"
note = "1 Blood, standard action, meeting an animal's eyes: win and your mind moves into its body."
focus = { Manipulation = "Use the first 2 dots of your Mental and Social in-clan disciplines while inside it." }
# Core p. 116 (#820): your mind is in an animal; your body lies empty.
