# Discipline powers by dot, with each discipline's test pool: quick notes, in our
# own words, summarised from MET: VTM, Volume 2 and Volume 2 Issue 1. Read by
# horatio.reference for the Play View's Pools tab; not part of the rule set, so
# nothing here changes what a character can buy.
#
# [[disciplines]]: `pool` and `versus` name an attribute and a skill (or
#   Willpower); leave `pool` out where the book has no standard test pool.
#   `focus` notes what an attribute focus adds to the whole discipline.
# [[powers]]: one per dot of a discipline or path. `focus` notes what a focus
#   adds to that power.
# `pools` (on either) changes a pool on the Pools tab while the character has
#   it: { pool, amount, when?, focus? }. `pool` is initiative, dodge, attack,
#   attack:<Skill>, defense, defense:<Attribute>, discipline:<Name>, skill:<Name>
#   or frenzy (where `beast` counts that many more Beast traits, or fewer); `amount`
#   is a number, "powers:<Discipline>" for how many powers of it the character
#   has, or "rating:<category>/<Name>"; a `when` naming a switch (see `active`)
#   makes it hold only while that switch is on, and any other `when` makes it a
#   variant ("While Injured"); `focus` limits it to characters with that focus,
#   `unless_focus` to those without it (for a bonus a focus replaces), and
#   `choice` (see `choices`) to those who chose that when buying the power.
# `active` (on a discipline, power or [[others]] entry): what the Play View can
#   switch on while the character has it, one table or a list of them (issue
#   #200): { key, name?, form?, combines?, page, book?, label?, health?,
#   attributes?, focuses?, blood?, notes? }. `key` is what `when` names; `name`
#   is shown (the power's name by default), with the purchase choices `label`
#   lists after it in brackets. `form = true` makes it transformative (a major
#   transformation: core p. 114, Vol. 2 Issue 1 p. 56): only one form is on at a
#   time, but for those it `combines` with. `page` (and `book`, the core book by
#   default) is where its rules are. While it is on:
#   - `health = [{ level, boxes, choice? }]` adds wound levels to the tracker;
#   - `attributes = [{ attribute, amount?, most?, pools?, choice? }]` changes an
#     attribute in the pools made on it: `amount` is added, `most` is the most it
#     counts as ("reduced to 3"), and `pools` (attack, defense or one pool's key)
#     limits it to some pools;
#   - `focuses = [Name]`: the character counts as having that focus, so what the
#     focus adds elsewhere in this file counts too;
#   - `blood = { per_turn?, most? }`: more Blood a turn, and `most = "half"` makes
#     the Blood pool half again as big (rounded up) until it ends;
#   - `notes = [text, or { note, choice?, focus? }]`: what can't be worked out.
# `choices` (on a power): what the player chooses when buying it, kept on the
#   discipline's trait and fixed afterwards: [{ key, label, default?, options? }].
#   `choice = { key = value }` on an entry makes it hold only for that choice.
# `cost` (on a discipline, power or [[others]] entry): what using it costs, for
#   its Use button on the Play View (issues #370 and #588): { blood = n } or
#   { willpower = n }, with `unless_focus` for a focus that makes it free. Leave it
#   out where the `note` starts with the cost ("1 Blood, standard action: …"),
#   which is read instead; a power whose cost comes later in its note gets no Use
#   button. Use spends it on every press, and turns the switch on if it is off, so
#   a cost paid each time (Projectile's 1 Blood an attack) is spent again.
# [[others]]: techniques, elder and luminary powers and merits with `pools`,
#   `damage`, `active`, `cost` or `forms`, by `category` and `name`; `needs = {
#   discipline, level }` when it works only with a power of a discipline. `forms`
#   is how many forms the character can be in at once while it has it, rather than
#   one (issue #597); never two from one power. Merits show no Use
#   button. What an elder or luminary power does, and its page, are its trait's
#   `description` and `page_reference` in bns_met_vampire_traits.toml (issue #587),
#   whether it has an entry here or not.
# [[attacks]]: what a successful attack of each type does by default, and what an
#   exceptional success adds (`exceptional`), with the book `page`. `skill` is the
#   skill the attack pool is made on (attack:<skill>); `kind` names the type.
# `damage` (on a discipline or power) changes the damage of attack pools while the
#   character has it: { attacks = [skills], amount?, exceptional?, type?, when?,
#   focus?, note?, page, book? }. `amount` is added to the damage and `exceptional` to what an
#   exceptional success adds on top of the usual one; `type = "aggravated"` makes
#   it aggravated. An entry whose `when` names a switch holds while it is on; any
#   other `when` holds only some of the time, so it is a `note` on the pool, not
#   part of the number shown. `page` is the book page (`book` as for `active`).

