# Discipline powers by dot, with each discipline's test pool: quick notes, in our
# own words, summarised from MET: VTM, Volume 2 and Volume 2 Issue 1. Read by
# horatio.reference for the Play View's Pools tab; not part of the rule set, so
# nothing here changes what a character can buy.
#
# [[disciplines]]: `pool` and `versus` name an attribute and a skill (or
#   Willpower); leave `pool` out where the book has no standard test pool.
#   `focus` notes what an attribute focus adds to the whole discipline.
# [[powers]]: one per dot of a discipline or path. `focus` notes what a focus
#   adds to that power.
# `pools` (on either) changes a pool on the Pools tab while the character has
#   it: { pool, amount, when?, focus? }. `pool` is initiative, dodge, attack,
#   attack:<Skill>, defense, defense:<Attribute>, discipline:<Name>, skill:<Name>
#   or frenzy (where `beast` counts that many more Beast traits, or fewer); `amount`
#   is a number, "powers:<Discipline>" for how many powers of it the character
#   has, "rating:<category>/<Name>", "morality_less_beast" for current Morality
#   minus current Beast traits, or "derangements" for current Derangement traits,
#   which the Play View counts from its trackers (it needs a `when` that names no
#   switch); a `when` naming a switch (see `active`) makes it hold only
#   while that switch is on, and any other `when` makes it a variant ("For 1
#   Blood"); `focus` limits it to characters with that focus, `unless_focus` to
#   those without it (for a bonus a focus replaces), and `choice` (see `choices`)
#   to those who chose that when buying the power. `note` makes it a reminder
#   under the pool instead of a number (under Also for frenzy), and `alternative`
#   ("Physical + Survival") names attributes and skills the character may test
#   with in the pool's place (issue #602). `against` with a switch's `when` makes
#   it hold only against someone ("your hunted target"): a line of its own under
#   the pool while the switch is on, not part of its total, with `label` naming
#   its part ("Accurate") and `qualities = [{ name, play, page, book? }]` the
#   equipment qualities it gives besides (issue #613).
# `active` (on a discipline, power or [[others]] entry): what the Play View can
#   switch on while the character has it, one table or a list of them (issue
#   #200): { key, name?, form?, combines?, page, book?, label?, health?,
#   attributes?, focuses?, blood?, notes? }. `key` is what `when` names; `name`
#   is shown (the power's name by default), with the purchase choices `label`
#   lists after it in brackets. `form = true` makes it transformative (a major
#   transformation: core p. 114, Vol. 2 Issue 1 p. 56): only one form is on at a
#   time, but for those it `combines` with. `page` (and `book`, the core book by
#   default) is where its rules are. While it is on:
#   - `health = [{ level, boxes, choice? }]` adds wound levels to the tracker, or
#     with fewer than none gives that many of the sheet's own in the category up
#     (issue #824: Bonecraft's Extra Limbs), back only when it ends (core p. 169);
#   - `attributes = [{ attribute, amount?, most?, pools?, choice? }]` changes an
#     attribute in the pools made on it: `amount` is added, `most` is the most it
#     counts as ("reduced to 3"), and `pools` (attack, defense or one pool's key)
#     limits it to some pools;
#   - `focuses = [Name]`: the character counts as having that focus, so what the
#     focus adds elsewhere in this file counts too;
#   - `blood = { per_turn?, most?, extra?, over? }`: more Blood a turn, `most = "half"`
#     makes the Blood pool half again as big (rounded up) until it ends, `extra` adds
#     that much to it (issue #824: Second Stomach), and `over = true` lets a use's
#     `gain` marked `over` take Blood past the pool while it is on; when it ends, the
#     Blood over the pool goes (issue #854: Mantle of Sutekh, Vol. 2 p. 240);
#   - `notes = [text, or { note, choice?, focus? }]`: what can't be worked out;
#   - `picks = { count, kind?, kinds?, only?, immune?, focus_count?, options?,
#     target? }`: what the player picks each time it goes on, `count` at most, or
#     more with a focus (`focus_count = { Manipulation = 2 }`). Equipment qualities
#     of `kind` (and `kinds`), or `only` those named (issue #599: Flesh of Marble's
#     two Protective Gear qualities), whose pool effects count as an equipped item's
#     do, or none with `immune` (qualities guarded against: Perfect Stance). Or the
#     power's own `options` (issue #821), each a table with `name`, `page` and
#     `book` (its switch's by default), `note`, and what it does while picked, as a
#     switch's: `health`, `attributes`, `focuses`, `blood`, `qualities`, and
#     `normal_form_only` to differ from its switch. `amount = { least?, most, label? }`
#     makes the player choose how much each use (issue #824: Tough's 1 to 3 Physical,
#     core p. 168): it is then one option for each amount, "Tough: 2", of which one is
#     picked at a time, and what its `health`, `attributes` and `blood` entries marked
#     `scale = true` give is that many times theirs. `from` names a trait that adds
#     it (Bonecraft Prodigy's options), `hidden_by` one that rules it out (Tzimisce:
#     Scar Tissue), and `focus`, `unless_focus` and `choice` hold as elsewhere. An
#     option is a switch of its own, "<key>/<name>", on while picked: a `when` in a
#     `pools`, `damage` or `test` entry may name it;
#   - `qualities = [{ kind, name, focus? }]`: equipment qualities it gives every
#     time it is on, without picking (#820: Armor of Terra's Hardened and Ballistic),
#     counted as picked ones are;
#   - `disciplines = [{ discipline, amount }]`: the character counts that many dots
#     more of a discipline it has, never past 5 (issue #849: Mercurial Vitality's
#     Potence and Fortitude, core p. 229). The powers gained by them hold while it
#     is on: their `pools` and `damage` with no `when` count as this switch's, and
#     their notes are added to it;
#   - `waives = [Name]`: using the named disciplines or powers costs nothing while
#     it is on (issue #849: Quickened Blood's Celerity, core p. 230).
#   `target` is who it can be used on (issue #823): "self" (the default), "other"
#   for one used only on another character of the home troupe (Fleshcraft reshaping
#   a willing person), or "any" for either. Used on another, it is an effect on
#   them, kept until undone, so a switch with another `target` is `kept`.
#   `hidden_by` on a switch rules the whole switch out for a character with that
#   trait, as on an option (Tzimisce: Scar Tissue on Malleable Visage, #812).
#   `kept = true` makes it last until undone rather than until the game ends (issue
#   #822): it is kept through Reset until the player turns it off (a removed heart,
#   a reshaped face), and using it again while it is on replaces it, as a character
#   carries one application at a time. Never a form. `normal_form_only = true`
#   pauses what it does while a form is on (core pp. 168-169: Vicissitude changes
#   don't carry into a transformed shape). `counts_as_form = true` makes it take one
#   of the forms Ravenous Conglomeration allows at once while it is kept (Vol. 2
#   p. 249). A frenzy `pools` entry with a switch's `when` counts its `beast` only
#   while that switch is on.
# `notes` (on a discipline, power or [[others]] entry): what it adds to another
#   entry's switch while the character has it (issue #601), shown with that switch
#   under its own name and page: [{ when, note, page, book?, focus?, choice? }],
#   `when` naming the switch. Its `pools` and `damage` with that `when` change the
#   switch's numbers the same way (Baal's Bloody Talons on Baal's Caress).
# `choices` (on a power): what the player chooses when buying it, kept on the
#   discipline's trait and fixed afterwards: [{ key, label, default?, options? }].
#   `choice = { key = value }` on an entry makes it hold only for that choice.
# `cost` (on a discipline, power or [[others]] entry): what using it costs, for
#   its Use button on the Play View (issues #370 and #588): { blood = n } or
#   { willpower = n }, with `unless_focus` for a focus that makes it free, and `most`
#   for one whose player chooses how much to spend, from n to `most` (issue #824:
#   Promises Like Steel's 1 to 3 Blood), a Use button for each. Leave it
#   out where the `note` starts with the cost ("1 Blood, standard action: …"),
#   which is read instead; a power whose cost comes later in its note gets no Use
#   button. Use spends it on every press, and turns the switch on if it is off, so
#   a cost paid each time (Projectile's 1 Blood an attack) is spent again.
#   `{ blood = "half" }` spends half the Blood the character has, rounded down,
#   and needs at least 2 (Indestructible, Vol. 2 p. 214).
# `use` (on a power or [[others]] entry): uses that change the trackers besides
#   spending (issue #825), each a button of its own on the Pools tab, made of
#   ordinary taps with one Undo: [{ label, cost?, heal?, convert?, mend?, gain?,
#   beast?, retainer?, animal?, summon?, summon_all?, when?, once?, focus?,
#   unless_focus?, target?, note?, page, book? }]. `target = "other"` makes it a use on another character of the home
#   troupe (issue #823), whose own trackers it changes (healing only, for now).
#   `cost` is as above, spent on each press. `heal = { damage, amount? }` heals
#   `amount` of "normal" or "aggravated" damage, of the "worst" first
#   (aggravated, then normal), "all" of it, or as much as the player says
#   ("asked"). `convert` turns that much aggravated damage to normal ("all" for
#   every box), and `mend` does so or, with no aggravated damage, heals normal.
#   `gain = { blood?, willpower?, over? }` restores them, never past the pool, but
#   with `over = true` Blood may go past it while a switch with `blood.over` is on
#   (issue #854). `beast`
#   takes Beast traits. `retainer` moves up to that much damage onto one of the
#   character's ghoul Retainers, an animal one with `animal = true` (issue #854:
#   Beast's Vigor). `summon` calls up one more of the entry's allies (see `summon`
#   below), by its key, and with `summon_all = true` every one it can have at once
#   (issue #827). `when` names a switch that must be on; `once`
#   says how often the book allows it ("Once a turn"), for the player to keep to,
#   since the Play View counts no turns. `focus` and `unless_focus` limit it as
#   for `pools`. Where an entry's uses spend, they take the place of its plain
#   Use button; where none does (Theft of Vitae's Blood drawn on a win), the
#   button stays for the spend. `charges = { counter, gain?, spend?, more?, fill?,
#   reset? }` changes one of the [[counters]] (issue #826): `gain` or `spend` that
#   many, `more = true` lets the player spend from `spend` up to all held (Vengeful
#   Strike), `fill` fills it to its most and `reset` empties it. A use whose only
#   change is to a counter at its most still spends its cost (Water Mastery's third
#   and later applications). `on` names a switch it turns on, if off.
# [[counters]]: charges, points and stacks a power builds and spends (issue #826),
#   a tracker of their own on the Play View, "charge:<key>", at none as each game
#   starts: { key, name, unit?, units?, most, note?, fades?, discipline?, power?,
#   other?, page, book? }. `most` is a number or an amount as in `pools`
#   ("powers:Kineticism", one a power of it). It shows with the discipline it names
#   (and under its `power`, if given) or with the technique, elder or luminary power
#   `other` names, and only for a character that has it. `unit` and `units` name one
#   and several on a use's button ("1 charge"). `fades = [{ label, keep?, off? }]`
#   are buttons that let them go, keeping `keep` (Kineticism's 1 going into a
#   fight), and switching `off` a switch: the Play View counts no fights or
#   minutes, so the player says when.
# `summon` (on a power or [[others]] entry): the allies it calls up at a game (issue
#   #827), one table or a list of them: { key, name, health?, blood?, most?, top?,
#   health_add?, note?, focus?, unless_focus?, needs?, has?, page, book? } (or
#   `reference` for a page range). Each ally has `health` levels (and `blood`), tapped
#   as a Retainer's are; none for one immune to harm. `most` is how many can be out at
#   once, a number, "powers:<Discipline>" or "rating:<category>/<Name>", at most `top`;
#   `health` can be counted the same way, plus `health_add`. Entries sharing a key are
#   variants: the last that holds for the sheet (its focus, a discipline level it
#   `needs`, a trait it `has`) is the one the character has. Allies are the game's:
#   each is gone when dismissed or when the game ends. An item a power makes for the
#   game is its switch, held while on, with the `qualities` or `picks` it gives.
# [[others]]: techniques, elder and luminary powers and merits with `pools`,
#   `damage`, `active`, `cost` or `forms`, by `category` and `name`; `needs = {
#   discipline, level }` when it works only with a power of a discipline. `forms`
#   is how many forms the character can be in at once while it has it, rather than
#   one (issue #597); never two from one power. Merits show no Use
#   button. What an elder or luminary power does, and its page, are its trait's
#   `description` and `page_reference` in bns_met_vampire_traits.toml (issue #587),
#   whether it has an entry here or not.
# [[attacks]]: what a successful attack of each type does by default, and what an
#   exceptional success adds (`exceptional`), with the book `page`. `skill` is the
#   skill the attack pool is made on (attack:<skill>); `kind` names the type.
# `damage` (on a discipline or power) changes the damage of attack pools while the
#   character has it: { attacks = [skills], amount?, exceptional?, type?, when?,
#   focus?, note?, page, book? }. `amount` is added to the damage and `exceptional` to what an
#   exceptional success adds on top of the usual one; `type = "aggravated"` makes
#   it aggravated. An entry whose `when` names a switch holds while it is on; any
#   other `when` holds only some of the time, so it is a `note` on the pool, not
#   part of the number shown. `page` is the book page (`book` as for `active`).
# `test` (on a discipline, power or [[others]] entry, one table or a list): a power
#   that deals damage through a test of its own (issue #600), a pool in Combat
#   while the switch its `when` names is on: { when, pool?, versus?, challenge?,
#   damage, exceptional?, type?, unreducible?, note?, name?, focus?, unless_focus?,
#   choice?, page, book? }. `pool` is "discipline:<Name>" for that discipline's test
#   pool, or an attribute and a skill; `challenge` says in words what it is tested
#   in where there is no pool; `unreducible = true` when nothing reduces the damage.

