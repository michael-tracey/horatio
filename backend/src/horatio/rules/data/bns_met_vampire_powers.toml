[[powers]]
discipline = "Animalism"
level = 5
name = "Drawing Out the Beast"
note = "1 Blood, simple action: drop out of frenzy at once, or throw yourself into a rage frenzy."
focus = { Manipulation = "Enter frenzy even when something (like Quell the Beast) would stop you." }

