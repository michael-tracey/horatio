# Equipment, written by hand (horatio.rules.equipment, issue #279): the four kinds of
# item, the grades, every quality of each kind, and the book's sample items.
#
# From MET: Vampire The Masquerade (2013), Chapter Thirteen, "Props, Weapons, and
# Armor", pp. 515-524, with the Ballistic and Hardened errata in the Vol. II Issue 1
# update, p. 23 (superseding p. 519). Page numbers are the book's printed ones. The
# effects are one-line summaries in our own words: the book has the full text.
# Included by the vampire and ghoul rule sets (`equipment_file`).
#
# [[kinds]]      key, name, description, page; what an item of the kind is with no
#                qualities: hands, damage (points of normal damage), shots and
#                range; and a note on the kind as a whole.
# [[grades]]     key, name, description, page, and max_qualities (none: no limit).
# [[qualities]]  kind, name, effect, play (what it does at the table, in a few words,
#                for the Play View: "+2 wild card bonus"), page, and the properties
#                horatio.rules.equipment lists at its top: two_handed,
#                needs_one_hand, no_slot_when_crafted, repeatable, needs_detail,
#                detail_prompt, ammo, excludes, shots, max_shots, range,
#                aggravated_against. An exclusion is written on both qualities.
# [[templates]]  name, kind, grade (standard if left out), page, and qualities: each
#                a name, or { name, detail }.

# --- kinds -------------------------------------------------------------------------

[[kinds]]
key = "melee"
name = "Melee weapon"
description = "Hand-to-hand weapons, such as swords, knives and clubs."
hands = 1
damage = 1
# Reach strikes "up to four steps away, rather than two" (p. 517).
range = "2 steps"
note = "Carrying one openly can draw unwanted attention."
page = "516"

[[kinds]]
key = "ranged"
name = "Ranged weapon"
description = "Weapons that hurt at a distance, such as pistols, rifles, flamethrowers and bows."
hands = 1
damage = 2
shots = 12
range = "50 steps"
note = "Reloading takes a simple action and the right ammunition."
page = "517"

[[kinds]]
key = "protective"
name = "Protective gear"
description = "Gear that protects from damage, such as armour or shields."
note = "No bonus by itself. One worn at a time, noticeable unless under bulky outerwear, and three standard actions to put on or take off."
page = "519"

[[kinds]]
key = "miscellaneous"
name = "Miscellaneous gear"
description = "Gear for challenges outside combat, such as lock-picks, a laptop or a vehicle."
note = "No use in combat challenges, and the bonuses of only one piece count at a time."
page = "520"

# --- grades ------------------------------------------------------------------------

[[grades]]
key = "cheap"
name = "Cheap"
description = "Cheap, easily obtained or improvised gear."
max_qualities = 1
page = "516"

[[grades]]
key = "standard"
name = "Standard or expensive"
description = "Standard-grade or expensive gear."
max_qualities = 2
page = "516"

# Horatio's own, not the book's: an item the troupe's storytellers make for a story,
# with any number of qualities (issue #280).
[[grades]]
key = "special"
name = "Special"
description = "A magical, ancient or otherwise exceptional item, made by the storytellers, with no limit on its qualities."

