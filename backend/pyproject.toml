[project]
name = "horatio"
version = "0.1.0"
description = "Character database and downtime system for Mind's Eye Theatre LARP troupes"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2,bcrypt]>=0.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horatio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated by Alembic autogenerate; long lines are left as generated.
"migrations/versions/*" = ["E501"]

[tool.pyright]
include = ["src", "tests", "migrations"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Starlette's test client now prefers the httpx2 fork. Horatio sticks with httpx
    # (the Discord connector uses it) until moving is decided on purpose.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
