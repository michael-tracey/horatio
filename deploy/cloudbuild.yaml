# Builds the Horatio image (../Dockerfile) and pushes it to Artifact Registry in
# the lotslarp project. Run by deploy.sh; what is uploaded is set by ../.gcloudignore.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'HORATIO_COMMIT=$_COMMIT'
      - '--build-arg'
      - 'HORATIO_BUILT_AT=$_BUILT_AT'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:$_TAG'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:latest'
      - '.'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:$_TAG'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:latest'

substitutions:
  _SERVICE_NAME: 'horatio'
  _REGION: 'us-east1'
  _ARTIFACT_REGISTRY_REPO: 'horatio'
  _TAG: 'manual'
  # The git commit and build time, shown on the custodian's System tab.
  _COMMIT: ''
  _BUILT_AT: ''

options:
  machineType: 'E2_HIGHCPU_8'
